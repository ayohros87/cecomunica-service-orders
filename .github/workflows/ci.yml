name: CI

# Valida antes de merge/deploy: lint + unit tests de las Cloud Functions, y
# compilación de reglas + test de integración del contador contra el emulador
# de Firestore (evita repetir el deploy accidental de reglas rotas).
on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # El frontend es vanilla sin build step: un paréntesis roto no truena
      # hasta que un usuario abre la página. node --check lo atrapa aquí.
      - name: Sintaxis del frontend (public/js) y functions
        run: |
          set -e
          find public/js functions/src functions/index.js functions/test functions/test-emulator \
            -name '*.js' -not -path '*/node_modules/*' -print0 |
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::Sintaxis rota"; exit 1; }
          done
          echo "Sintaxis OK"

      # lucide.min.js (401 KB) debe ir SIEMPRE en defer, con ?v= y seguido de
      # icons.js (que hace el barrido inicial de iconos). Un tag síncrono o sin
      # versión regresa el bloqueo de render que se quitó en el plan de arranque.
      - name: Lucide en defer + icons.js adyacente
        run: |
          set -e
          # login.html es la excepción deliberada (carga sync); tools/ no se despliega.
          filtro() { grep -v '^public/tools/' | grep -v '^public/login.html' || true; }
          bad=$(grep -rlE '<script src="[^"]*lucide\.min\.js' public --include='*.html' | filtro)
          if [ -n "$bad" ]; then
            echo "::error::lucide.min.js sin defer (bloquea el render) en: $bad"; exit 1
          fi
          bad=$(grep -rlE 'lucide\.min\.js"' public --include='*.html' | filtro)
          if [ -n "$bad" ]; then
            echo "::error::lucide.min.js sin ?v= (caché immutable de /js/vendor/ lo exige) en: $bad"; exit 1
          fi
          bad=$(grep -rlE 'lucide\.min\.js\?v=' public --include='*.html' | filtro | while read -r f; do
            grep -A2 'lucide\.min\.js?v=' "$f" | grep -q 'js/core/icons\.js' || echo "$f"
          done || true)
          if [ -n "$bad" ]; then
            echo "::error::falta js/core/icons.js inmediatamente después de lucide en: $bad"; exit 1
          fi
          echo "Lucide OK"

      # En CSS, @import solo vale al inicio de la hoja (solo @charset y @layer
      # pueden precederlo). Si queda debajo de otra regla el navegador lo ignora
      # SIN avisar y la hoja importada nunca carga: asi murio app-kit-extras.css
      # cuando los @font-face self-hosted se metieron arriba del @import, y el
      # login quedo con texto blanco sobre fondo blanco.
      - name: "@import al inicio de cada CSS"
        run: node tools/check-css-import-first.js public

      - name: Install functions deps
        working-directory: functions
        run: npm ci

      # Un export roto en index.js tumba el deploy COMPLETO de functions.
      - name: functions/index.js carga (exports completos)
        run: node -e "require('./functions/index.js'); console.log('index.js OK')"

      - name: Lint functions
        working-directory: functions
        run: npm run lint

      - name: Unit tests
        working-directory: functions
        run: npm test

      - name: Set up Java (Firestore emulator)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Rules + counter integration (emulator)
        # Proyecto demo-* → el emulador corre sin credenciales. Arrancar el emulador
        # compila las reglas (falla si son inválidas); luego se ejercitan contra
        # Firestore real: recomputarContadorTx (contador, incl. concurrencia), la
        # numeración de contratos (fecha local + reserva atómica) y el scoping por
        # rol de las reglas (permitido/denegado por colección).
        # TZ=America/Panama: la regresión del número de contrato era de zona
        # horaria y en UTC (default del runner) el caso ni siquiera se reproduce.
        env:
          TZ: America/Panama
        run: firebase emulators:exec --only firestore --project demo-ci "node functions/test-emulator/recompute.js && node functions/test-emulator/numero-contrato.js && node functions/test-emulator/rules.js"
