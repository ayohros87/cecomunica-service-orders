<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Los contratos se crean en el Centro – Cecomunica</title>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <meta name="theme-color" content="#0B2A47">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=sh1">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg-page); }
    .aviso { max-width:520px; padding:32px; background:var(--surface-card); border:1px solid var(--border-default);
             border-radius:8px; box-shadow:0 1px 2px rgba(11,42,71,.05), 0 8px 24px -12px rgba(11,42,71,.18); }
    .aviso h1 { font:700 22px/1.25 var(--font-display); color:var(--navy); margin:0 0 12px; }
    .aviso p  { font-size:15px; color:var(--fg-2); margin:0 0 14px; }
    .aviso .nota { font-size:13.5px; color:var(--fg-3); }
  </style>
</head>
<body>
  <!-- Retirada 2026-09-09 (F5 del archivo). El formulario clásico es la razón
       por la que un alquiler nuevo salía con el formato de contrato anterior:
       no estampaba `documento_version` y tampoco armaba el plan por serial.
       Se deja la página, no un 404: hay enlaces viejos en correos.
       Si hubiera que revivirla, los módulos nc-*.js siguen en js/pages/. -->
  <div class="aviso">
    <h1>Los contratos se crean en el Centro de gestión</h1>
    <p>
      Este formulario se retiró. El contrato se arma ahora en la ficha del cliente, que además
      decide el plan por serial y usa el documento nuevo.
    </p>
    <p class="nota">Te llevo para allá…</p>
    <a class="btn btn-primary" id="ir" href="../clientes/centro.html">Ir al Centro de gestión</a>
  </div>
  <script>
    // Se conserva el cliente si venía en la URL: quien llegó aquí desde
    // "crear contrato para X" no debería tener que volver a buscar a X.
    (function () {
      const p = new URLSearchParams(location.search);
      const cliente = p.get('cliente_id') || p.get('id');
      const destino = cliente
        ? `../clientes/centro.html?id=${encodeURIComponent(cliente)}`
        : '../clientes/centro.html';
      document.getElementById('ir').href = destino;
      setTimeout(() => location.replace(destino), 2500);
    })();
  </script>
</body>
</html>
