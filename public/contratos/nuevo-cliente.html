<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>La ficha del cliente se mudó – Cecomunica</title>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <meta name="theme-color" content="#0B2A47">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=46b11f71">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg-page); }
    .aviso { max-width:520px; padding:32px; background:var(--surface-card); border:1px solid var(--border-default);
             border-radius:8px; box-shadow:0 1px 2px rgba(11,42,71,.05), 0 8px 24px -12px rgba(11,42,71,.18); }
    .aviso h1 { font:700 22px/1.25 var(--font-display); color:var(--navy); margin:0 0 12px; }
    .aviso p  { font-size:15px; color:var(--fg-2); margin:0 0 14px; }
    .aviso .nota { font-size:13.5px; color:var(--fg-3); }
  </style>
</head>
<body>
  <!-- Retirada 2026-09-28 (auditoría UX, T9 "una sola forma de hacer cada
       cosa"): este era el SEGUNDO formulario de cliente. El alta, la edición,
       el bloque IP y los documentos del cliente viven en clientes/ficha.html.
       Se deja la página, no un 404: hay enlaces viejos en correos y marcadores. -->
  <div class="aviso">
    <h1>La ficha del cliente está en un solo lugar</h1>
    <p>
      Este formulario se retiró. Los datos del cliente y sus documentos se editan ahora en la
      ficha del cliente.
    </p>
    <p class="nota">Te llevo para allá…</p>
    <a class="btn btn-primary" id="ir" href="../clientes/ficha.html?nuevo=1">Ir a la ficha del cliente</a>
  </div>
  <script>
    // Se conserva todo lo que traía la URL (?id=, ?from=): quien llegó a
    // "editar a X" no debería tener que volver a buscar a X. El ancla vieja
    // #docsSection se traduce a ?seccion=documentos, que la ficha entiende.
    (function () {
      const p = new URLSearchParams(location.search);
      if (!p.get('id')) p.set('nuevo', '1');
      if (location.hash === '#docsSection') p.set('seccion', 'documentos');
      const destino = '../clientes/ficha.html?' + p.toString();
      document.getElementById('ir').href = destino;
      location.replace(destino);
    })();
  </script>
</body>
</html>
