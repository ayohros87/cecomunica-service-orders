<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Las bajas se hacen en el Centro – Cecomunica</title>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <meta name="theme-color" content="#0B2A47">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=sh3">
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg-page); }
    .aviso { max-width:520px; padding:32px; background:var(--surface-card); border:1px solid var(--border-default);
             border-radius:8px; box-shadow:0 1px 2px rgba(11,42,71,.05), 0 8px 24px -12px rgba(11,42,71,.18); }
    .aviso h1 { font:700 22px/1.25 var(--font-display); color:var(--navy); margin:0 0 12px; }
    .aviso p  { font-size:15px; color:var(--fg-2); margin:0 0 14px; }
    .aviso .nota { font-size:13.5px; color:var(--fg-3); }
  </style>
</head>
<body>
  <!-- Retirada 2026-09-09 (F5 del archivo). La baja es hoy una gestión GB en el
       Centro: lleva la carta del cliente, la penalidad estimada y la fecha de
       fin de facturación, cosas que esta pantalla no pedía. Se verificó contra
       producción antes de retirarla: la colección `cancelaciones` está VACÍA
       (0 documentos), así que no queda ninguna solicitud varada aquí. -->
  <div class="aviso">
    <h1>Las bajas se hacen en el Centro de gestión</h1>
    <p>
      Esta pantalla se retiró. La baja o terminación se solicita desde la ficha del cliente,
      con la carta del cliente adjunta, la penalidad estimada y la fecha hasta la que se factura.
    </p>
    <p class="nota">Te llevo para allá…</p>
    <a class="btn btn-primary" id="ir" href="../clientes/centro.html">Ir al Centro de gestión</a>
  </div>
  <script>
    (function () {
      const p = new URLSearchParams(location.search);
      const cliente = p.get('cliente_id');
      const destino = cliente
        ? `../clientes/centro.html?id=${encodeURIComponent(cliente)}`
        : '../clientes/centro.html';
      document.getElementById('ir').href = destino;
      setTimeout(() => location.replace(destino), 2500);
    })();
  </script>
</body>
</html>
