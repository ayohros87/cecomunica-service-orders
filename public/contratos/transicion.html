<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Transición de equipos - Cecomunica</title>
  <link rel="stylesheet" href="../css/ceco-ui.css?v=bf320539">
  <link rel="stylesheet" href="../css/ceco-rail.css?v=dc265958">
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=4174cf91"></script>
  <script src="../js/core/modulos.js?v=1838cd29"></script>
  <script src="../js/core/layout.js?v=68295191"></script>
  <script src="../js/core/roles.js?v=7a4f1b6f"></script>
  <script src="../js/core/formatting.js?v=b2dcba44"></script>
  <script src="../js/core/auth.js?v=5bb0cc34"></script>
  <script src="../js/core/serial.js?v=37e4721b"></script> <!-- identidad de serial (Serial.norm), antes de los servicios -->
  <script defer src="../js/services/contratosService.js?v=2718de61"></script>
  <script defer src="../js/services/equiposPoolService.js?v=b70f2655"></script>
  <script defer src="../js/ui/equipo-ficha.js?v=129bd791"></script>
  <script defer src="../js/services/empresaService.js?v=b03e2553"></script>
  <script defer src="../js/ui/toast.js?v=f4e03438"></script>
  <script defer src="/js/vendor/lucide.min.js?v=5cc49c5c"></script>
  <script defer src="/js/core/icons.js?v=1c619298"></script>
  <script defer src="../js/ui/modal.js?v=0e2e184d"></script> <!-- Modal.confirm/prompt en vez de los nativos -->
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">
  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbar({
      title: '<i data-lucide="arrow-left-right"></i> Transición de equipos',
      back: { label: '<i data-lucide="arrow-left"></i> Volver', href: 'index.html' },
      showHome: true,
      homeHref: '../index.html',
      showLogout: true
    });
  </script>

  <div class="app-wrap app-wrap--wide">

    <nav class="app-breadcrumbs" aria-label="Breadcrumb">
      <a href="../index.html">Inicio</a>

      <a href="index.html">Contratos</a>

    </nav>

    <div class="app-page-header">
      <div>
        <h1>Transición de equipos</h1>
        <p id="ph-subtitle">Mapea los equipos salientes del cliente con los entrantes del contrato nuevo.</p>
      </div>
    </div>

    <div id="transBody">
      <div class="ds-card ds-card-padded" style="text-align:center; color:var(--fg-3);">Cargando…</div>
    </div>
  </div>

  <div id="toasts" class="toast-region" aria-live="polite"></div>

  <script defer src="../js/domain/transicionPlan.js?v=dce25034"></script>
  <script src="../js/pages/contrato-transicion-page.js?v=44832a4c" defer></script>
  </div> <!-- /cc-work -->

    document.addEventListener('DOMContentLoaded', () => Layout.initRail('contratos'));
  </script>

</html>
