<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>El contrato se edita en el Centro – Cecomunica</title>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <meta name="theme-color" content="#0B2A47">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=sh5">
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=ses2"></script>
  <style>
    body { display:flex; align-items:center; justify-content:center; min-height:100vh; margin:0; background:var(--bg-page); }
    .aviso { max-width:520px; padding:32px; background:var(--surface-card); border:1px solid var(--border-default);
             border-radius:8px; box-shadow:0 1px 2px rgba(11,42,71,.05), 0 8px 24px -12px rgba(11,42,71,.18); }
    .aviso h1 { font:700 22px/1.25 var(--font-display); color:var(--navy); margin:0 0 12px; }
    .aviso p  { font-size:15px; color:var(--fg-2); margin:0 0 14px; }
    .aviso .nota { font-size:13.5px; color:var(--fg-3); }
  </style>
</head>
<body>
  <!-- Retirada 2026-09-10: el editor vive dentro del Centro
       (Centro.editarContrato). La página se queda como REENVÍO porque cinco
       sitios la enlazan —admin·integridad, admin·operación y tres alertas de
       auditoría— y porque hay correos viejos con este enlace. Resuelve el
       cliente del contrato y abre su ficha con el contrato ya seleccionado;
       si no puede resolverlo, deja al usuario en el Centro en vez de en un 404. -->
  <div class="aviso">
    <h1>El contrato se edita en el Centro</h1>
    <p>
      El editor se mudó a la ficha del cliente, donde vive el resto de la cuenta: los seriales,
      las gestiones y el historial.
    </p>
    <p class="nota" id="estado">Buscando el contrato…</p>
    <a class="btn btn-primary" id="ir" href="../clientes/centro.html">Ir al Centro de gestión</a>
  </div>
  <script>
    (function () {
      const id = new URLSearchParams(location.search).get('id');
      const estado = document.getElementById('estado');
      const ir = document.getElementById('ir');
      const alCentro = (url, texto) => {
        ir.href = url;
        estado.textContent = texto;
        setTimeout(() => location.replace(url), 1500);
      };
      if (!id) { alCentro('../clientes/centro.html', 'Te llevo al Centro…'); return; }
      // Esperar a que el SDK (defer) esté listo y haya sesión: sin auth las
      // rules rechazan la lectura y el usuario vería "no se pudo".
      const arrancar = () => firebase.auth().onAuthStateChanged(async (u) => {
        if (!u) { location.href = '/login.html'; return; }
        try {
          const snap = await firebase.firestore().collection('contratos').doc(id).get();
          const cli = snap.exists ? (snap.data().cliente_id || '') : '';
          if (cli) {
            alCentro(`../clientes/centro.html?id=${encodeURIComponent(cli)}&contrato=${encodeURIComponent(id)}`,
              'Abriendo la ficha del cliente…');
            return;
          }
        } catch (e) { console.warn('No se pudo resolver el contrato:', e); }
        alCentro('../clientes/centro.html', 'No se pudo resolver ese contrato — te llevo al Centro.');
      });
      if (window.firebase?.auth) arrancar();
      else window.addEventListener('DOMContentLoaded', arrancar);
    })();
  </script>
</body>
</html>
