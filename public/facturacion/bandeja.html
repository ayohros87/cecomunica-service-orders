<!DOCTYPE html>
<html lang="es">
<head>
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="preload" href="/brand/fonts/ibm-plex-sans-400-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/brand/fonts/barlow-700-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Facturación pendiente - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=74b79c3f">
  <link rel="stylesheet" href="../css/ceco-rail.css?v=c83fa1b2">
  <link rel="stylesheet" href="../css/bandeja.css?v=0d25ff09">
  <link rel="stylesheet" href="../css/ws-tabs.css?v=36ec8d37">

  <link rel="stylesheet" href="../css/facturacion-bandeja.css?v=6ce31502">

  <script src="../js/ui/workspace-tabs.js?v=d6888fb5"></script>
  <script src="../js/ui/finanzas-nav.js?v=6712d557"></script>

          <script src="../js/core/modulos.js?v=9700916f"></script>
  <script src="../js/core/layout.js?v=b5bb4629"></script>
  <script src="../js/core/roles.js?v=36df3f84"></script>
  <script src="../js/core/formatting.js?v=cf59a4c1"></script>
  <script type="module" src="/js/entry/facturacion-bandeja.js"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

<div id="topbar-mount"></div>
<script>
  Layout.renderTopbarFor('index', {
    back: { href: '../index.html', label: '<i data-lucide="arrow-left"></i> Inicio' },
    title: '<i data-lucide="inbox"></i> Facturación pendiente',
  });
</script>

<div class="app-wrap app-wrap--full">

  <!-- La barra de Finanzas solo para admin/contabilidad (información financiera
       need-to-know). Recepción entra por su módulo "Facturación pendiente" y ve
       la bandeja sola. Se decide con la sesión cacheada en DOMContentLoaded
       (mismo patrón optimista que el rail) para que no salte tras el auth;
       facturacion-bandeja.js lo confirma con el rol real. -->
  <div id="wsTabs-mount"></div>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const c = window.Sesion && Sesion.cacheAnonima ? Sesion.cacheAnonima() : null;
      if (c && ['administrador', 'contabilidad'].includes(c.rol)) FinanzasNav.render('bandeja');
    });
  </script>
  <p class="fb-intro">
    Cada vez que un contrato, renovación, aumento, ajuste o baja se vuelve efectivo, aparece aquí (y llega el correo a activaciones@).
    Marca <b>QBO</b> cuando lo hayas facturado en QuickBooks y <b>Plataforma PoC</b> cuando el servicio esté al día en la plataforma. Lo más viejo va arriba.
  </p>

  <div id="fbAviso" class="fb-aviso" hidden></div>

  <div class="bj-barra" id="fbChips">
    <span class="bj-buscar"><i data-lucide="search"></i><input type="search" id="fbBuscar" class="form-input" placeholder="Buscar cliente o contrato…" autocomplete="off" aria-label="Buscar cliente o contrato…"></span>
    <div class="bj-filtros" role="tablist" aria-label="Filtrar">
    <button type="button" class="bj-filtro bj-filtro--all active" data-f="all" role="tab">Pendientes <span class="cnt" data-cnt="all">0</span><span class="errdot" data-err="all" hidden></span></button>
    <button type="button" class="bj-filtro bj-filtro--listo" data-f="arranca" role="tab"><span class="dot"></span>Arranca cobro <span class="cnt" data-cnt="arranca">0</span><span class="errdot" data-err="arranca" hidden></span></button>
    <button type="button" class="bj-filtro bj-filtro--info" data-f="cambia" role="tab"><span class="dot"></span>Cambia cobro <span class="cnt" data-cnt="cambia">0</span><span class="errdot" data-err="cambia" hidden></span></button>
    <button type="button" class="bj-filtro bj-filtro--aviso" data-f="termina" role="tab"><span class="dot"></span>Termina cobro <span class="cnt" data-cnt="termina">0</span><span class="errdot" data-err="termina" hidden></span></button>
    <button type="button" class="bj-filtro bj-filtro--neutro" data-f="espera" role="tab" title="Esperando la entrega de los equipos: todavía no hay nada que facturar"><span class="dot"></span>En espera <span class="cnt" data-cnt="espera">0</span><span class="errdot" data-err="espera" hidden></span></button>
    <button type="button" class="bj-filtro bj-filtro--aviso" data-f="sinnum" role="tab" title="QBO marcado sin número de factura: sin él no se puede verificar el pago contra QuickBooks. Clic en la pastilla con ? para anotarlo"><span class="dot"></span>Sin número <span class="cnt" data-cnt="sinnum">0</span></button>
    </div>
    <span class="push"></span>
    <label class="fb-toggle"><input type="checkbox" id="fbVerHechos"> Ver hechos y no aplica</label>
  </div>

  <div id="fbRows" class="fb-rows"><div class="fb-vacio">Cargando…</div></div>
</div>

  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    // Rail activo: admin/contabilidad llegan por Finanzas; recepción por su módulo.
    document.addEventListener('DOMContentLoaded', () => {
      const c = window.Sesion && Sesion.cacheAnonima ? Sesion.cacheAnonima() : null;
      Layout.initRail(c && ['administrador', 'contabilidad'].includes(c.rol) ? 'facturacion' : 'facturacion_bandeja');
    });
  </script>
</body>
</html>
