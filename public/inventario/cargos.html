<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8" />
  <title>Cargos de Facturación - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="stylesheet" href="../css/ceco-ui.css?v=cc28">
  <!-- Rediseño Command Center F5: rail lateral (híbrido). PLAN_REDISENO_COMMAND_CENTER.md -->
  <link rel="stylesheet" href="../css/ceco-rail.css?v=cc8">
  <link rel="stylesheet" href="../css/ws-tabs.css?v=f2">
  <script src="../js/ui/workspace-tabs.js?v=f2"></script>
  <script src="../js/ui/finanzas-nav.js?v=f3"></script>

  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-functions-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=ses2"></script>
  <script src="../js/core/modulos.js?v=cc13"></script>
  <script src="../js/core/layout.js?v=cc13"></script>
  <script src="../js/core/roles.js"></script>
  <script defer src="../js/services/usuariosService.js"></script>
  <script defer src="../js/services/cargosService.js"></script>
  <script defer src="/js/vendor/lucide.min.js?v=1"></script>
  <script defer src="/js/core/icons.js?v=1"></script>

  <style>
    #tabla td { padding: 2px 6px; vertical-align: middle; }
    #tabla .td-input, #tabla .td-select { height: 28px; }
    #tabla .td-num { text-align: left; font-family: var(--font-mono); width: 100px; }
    #tabla tbody tr:nth-child(even) { background: var(--surface-sunken); }
    #tabla tbody tr:hover { background: var(--brand-soft); }
    #tabla tbody tr:focus-within { background: #eaf4ff; }
    #tabla .toggle-switch { display: inline-block; vertical-align: middle; }
    .concepto-cell { position: relative; padding-left: 16px !important; }
    .row-status {
      position: absolute; left: 4px; top: 50%; transform: translateY(-50%);
      width: 6px; height: 6px; border-radius: 50%; background: transparent; transition: background var(--dur-fast);
    }
    .row-status.saving { background: var(--status-warning); animation: rowPulse 1s ease-in-out infinite; }
    .row-status.saved  { background: var(--status-online); }
    .row-status.error  { background: var(--status-critical); }
    @keyframes rowPulse { 0%,100%{ opacity:1 } 50%{ opacity:.3 } }
    .md-stats { font-size:13px; color:var(--fg-3); }
    .md-stats b { font-family:var(--font-mono); color:var(--fg-1); }
  </style>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

<div id="topbar-mount"></div>
<script>
  Layout.renderTopbarFor('index', {
    back: { href: './modelos.html', label: '<i data-lucide="arrow-left"></i> Finanzas' },
    title: '<i data-lucide="receipt"></i> Cargos de Facturación',
    leftSlot: `
      <div class="filter-search" style="max-width:300px;">
        <span class="search-icon"><i data-lucide="search"></i></span>
        <input id="q" type="search" placeholder="Buscar cargo…" aria-label="Buscar cargos">
      </div>`,
    actions: [
      { label: '<i data-lucide="plus"></i> Nuevo cargo', cls: 'primary', onclick: "agregarCargo()" }
    ],
    menu: [
      { onclick: 'agregarCargo()', label: '<i data-lucide="plus"></i> Nuevo cargo' },
      { divider: true },
      { html: '<label class="overflow-menu-item"><input type="checkbox" id="chk-inactivos"> Mostrar inactivos</label>' }
    ]
  });
</script>

<div class="app-wrap app-wrap--full">

  <!-- Navegación del espacio Finanzas (propuesta 2026-08, E3/E4) -->
  <div id="wsTabs-mount"></div>
  <div id="wsSubTabs-mount"></div>
  <script>FinanzasNav.render('catalogo', 'cargos'); // en el parse: la barra sale en el primer frame</script>
  <div class="ds-card" style="padding:0;">
    <div style="padding:var(--sp-3) var(--sp-4); display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap;">
      <p id="resumen" class="md-stats" style="margin:0;">Cargando…</p>
      <div style="display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
        <p id="qboHint" style="margin:0; font-size:12px; color:var(--fg-4);"></p>
        <!-- Alta también a la altura del contenido (igual que en Modelos). -->
        <button type="button" class="btn primary" onclick="agregarCargo()"><i data-lucide="plus"></i> Nuevo cargo</button>
      </div>
    </div>
    <div class="app-table-wrap" style="border:none; box-shadow:none; border-radius:0; overflow:auto;">
      <table class="app-table" id="tabla">
        <thead>
          <tr>
            <th>Concepto</th>
            <th>Item QBO</th>
            <th>Monto def. $</th>
            <th style="text-align:center">Recurrente</th>
            <th style="text-align:center">Activo</th>
            <th style="text-align:center">Borrar</th>
          </tr>
        </thead>
        <tbody id="tablaCargos"></tbody>
      </table>
    </div>
  </div>
</div>

<script defer src="../js/ui/toast.js"></script>
<script src="../js/pages/cargos.js" defer></script>
  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    // Rail Command Center (F5) — espera auth (scripts defer) y pinta el rail del rol efectivo.
    document.addEventListener('DOMContentLoaded', () => Layout.initRail('facturacion'));
  </script>
</body>
</html>
