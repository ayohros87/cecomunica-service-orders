<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Equipos por serial - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <!-- Stub de redirección (auditoría UX 2026-09-28, P2 #14: "una sola casa").
       Esta página era la segunda casa del inventario; todo lo que tenía vive
       ahora en /almacen/index.html: la lista por serial es la pestaña Avanzado
       (?tab=serial), la ficha/kardex se abre con ?serial= sobre Existencias, la
       cola de Conflictos está en Hoy y los asistentes se abren con ?accion=.
       Los deep-links viejos (señales del home, centro de clientes, correos)
       se traducen aquí, así que ningún enlace guardado se rompe. -->
  <script>
    (function () {
      var q = new URLSearchParams(location.search);
      var d = new URLSearchParams();
      var serial = q.get('serial');
      var tab = q.get('tab');
      var accion = q.get('accion');
      if (serial) {
        // ?serial= → la ficha del serial encima de Existencias.
        d.set('tab', 'existencias'); d.set('serial', serial);
      } else if (accion === 'recibir' || accion === 'vender' || accion === 'conteo') {
        d.set('accion', accion);
      } else if (tab === 'conflictos') {
        // La cola de Conflictos es la de Hoy (sin ?tab).
      } else if (tab || q.get('verificar') || q.get('modelo')) {
        d.set('tab', 'serial');
        if (tab) d.set('estado', tab);
        if (q.get('verificar')) d.set('verificar', '1');
        if (q.get('modelo')) d.set('modelo', q.get('modelo'));
      } else {
        d.set('tab', 'existencias');
      }
      var qs = d.toString();
      location.replace('/almacen/index.html' + (qs ? '?' + qs : ''));
    })();
  </script>
</head>
<body style="font-family:system-ui,sans-serif; padding:24px; color:#334155;">
  <p>Equipos por serial ahora vive en <a href="/almacen/index.html?tab=serial">Almacén · Avanzado</a>. Redirigiendo…</p>
</body>
</html>
