<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Importar Dispositivos POC - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=cc24">
  <!-- Rediseño Command Center F5: rail lateral (híbrido). PLAN_REDISENO_COMMAND_CENTER.md -->
  <link rel="stylesheet" href="../css/ceco-rail.css?v=cc7">

  <!-- SheetJS se carga BAJO DEMANDA al importar/exportar (js/core/xlsx-loader.js) -->
  <script defer src="../js/core/xlsx-loader.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=ses2"></script>
  <script defer src="../js/services/pocService.js?v=cc10"></script>
  <script defer src="../js/services/simCardsService.js"></script>
  <script src="../js/core/modulos.js"></script>
  <script src="../js/core/layout.js?v=cc11"></script>
  <script defer src="/js/vendor/lucide.min.js?v=1"></script>
  <script defer src="/js/core/icons.js?v=1"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbarFor('child', {
      title: '<i data-lucide="upload"></i> Importar Dispositivos POC',
      back:  { href: 'index.html' }
    });
  </script>

  <div class="app-wrap app-wrap--default">

    <!-- Importar desde Excel -->
    <div class="form-section-header">
      <h3><i data-lucide="upload"></i> Importar desde Excel</h3>
    </div>
    <div class="ds-card ds-card-padded" style="margin-bottom:var(--sp-4);">
      <div class="form-field">
        <label class="form-label" for="archivoExcel">Selecciona archivo Excel (.xlsx)</label>
        <label class="form-file-zone" tabindex="0" role="button">
          <input type="file" id="archivoExcel" accept=".xlsx">
          <div class="form-file-zone-icon"><i data-lucide="file-spreadsheet" style="width:32px;height:32px;"></i></div>
          <p><strong>Arrastra tu archivo aquí</strong> o haz clic para seleccionar</p>
          <span>XLSX · hoja "BD" con columnas SERIAL, CLIENTE, OPERADOR, etc.</span>
        </label>
      </div>

      <div class="form-actions">
        <!-- Dos pasos a propósito (auditoría P0): antes "Importar" escribía
             directo a Firestore sin preview ni dedup — re-importar el mismo
             archivo (o un doble click) duplicaba la base entera. -->
        <button class="btn btn-primary" id="btnRevisar" onclick="revisarArchivo()"><i data-lucide="search-check"></i> Revisar archivo</button>
        <button class="btn btn-secondary" id="btnImportar" onclick="importarRevisadas()" disabled><i data-lucide="upload"></i> Importar</button>
      </div>

      <div id="estadoImportacion" class="alert-banner" style="display:none; margin-top:var(--sp-3);">
        <span class="alert-banner-icon"><i data-lucide="info"></i></span>
        <div class="alert-banner-body" id="estadoImportacionBody"></div>
      </div>

      <div id="previewImport" style="display:none; margin-top:var(--sp-3); font-size:13px;"></div>
    </div>

    <!-- Exportar dispositivos actuales -->
    <div class="form-section-header">
      <h3><i data-lucide="download"></i> Exportar dispositivos actuales</h3>
    </div>
    <div class="ds-card ds-card-padded">
      <p style="font-size:13px; color:var(--fg-3); margin:0 0 var(--sp-3);">
        Descarga un Excel con todos los dispositivos PoC registrados, listo para edición masiva.
      </p>
      <button class="btn btn-secondary" onclick="exportarDispositivos()"><i data-lucide="file-text"></i> Exportar a Excel</button>
    </div>

  </div>

<script>
function setEstado(mensaje, tipo = 'info') {
  const el = document.getElementById('estadoImportacion');
  const body = document.getElementById('estadoImportacionBody');
  el.className = `alert-banner alert-${tipo}`;
  body.textContent = mensaje;
  el.style.display = '';
}

const escHtml = v => String(v == null ? '' : v).replace(/[&<>"']/g, s =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[s]));

// Estado del flujo en dos pasos: revisar → importar. El cambio de archivo
// invalida la revisión (lo revisado ya no describe lo que se va a importar).
let _rolPuedeImportar = false;
let _revision = null;   // { nuevas, existentes, repetidas, sinSerial, nombre }
let _ocupado = false;

document.addEventListener('DOMContentLoaded', () => {
  // Guard de auth + rol (auditoría P0): esta página escribía a Firestore por
  // URL directa sin validar sesión ni rol. Mismo criterio de escritura que la
  // Base PoC (poc-state.esLectura): técnico/vista/jefe_taller solo leen.
  verificarAccesoYAplicarVisibilidad((rol) => {
    const soloLectura = ['tecnico', 'vista', 'jefe_taller'].includes(rol);
    const tieneModulo = window.MODULOS ? MODULOS.puedeVer(rol, 'poc') : false;
    _rolPuedeImportar = tieneModulo && !soloLectura;
    if (!_rolPuedeImportar) {
      setEstado('Tu rol no puede importar dispositivos. Volviendo a la Base PoC…', 'warning');
      setTimeout(() => { location.href = 'index.html'; }, 1800);
    }
  });
  document.getElementById('archivoExcel').addEventListener('change', _invalidarRevision);
});

function _invalidarRevision() {
  _revision = null;
  document.getElementById('btnImportar').disabled = true;
  const prev = document.getElementById('previewImport');
  prev.style.display = 'none';
  prev.innerHTML = '';
}

function _pintarRevision() {
  const { nuevas, existentes, repetidas, sinSerial, nombre } = _revision;
  const lista = (arr) => arr.slice(0, 60).map(escHtml).join(', ') + (arr.length > 60 ? ` … (+${arr.length - 60} más)` : '');
  const bloque = (n, titulo, detalle) => n
    ? `<details style="margin:4px 0;"><summary><b>${n}</b> ${titulo}</summary>
         <div style="color:var(--fg-3); margin:4px 0 0 14px; word-break:break-word;">${detalle}</div></details>`
    : '';
  const prev = document.getElementById('previewImport');
  prev.innerHTML = `
    <div class="ds-card ds-card-padded" style="background:var(--bg-2, #f8fafc);">
      <p style="margin:0 0 6px;"><b>${escHtml(nombre)}</b> · ${nuevas.length + existentes.length + repetidas.length + sinSerial.length} filas leídas de la hoja "BD":</p>
      <p style="margin:0 0 6px; color:${nuevas.length ? 'var(--ok, #15803d)' : 'var(--fg-3)'};"><b>${nuevas.length}</b> dispositivos nuevos por importar.</p>
      ${bloque(existentes.length, 'ya existen en la base — se omiten (antes se duplicaban al re-importar)', lista(existentes))}
      ${bloque(repetidas.length, 'seriales repetidos dentro del archivo — se importa solo la primera fila', lista(repetidas))}
      ${bloque(sinSerial.length, 'filas sin SERIAL — se omiten', 'Complete el serial en el Excel y vuelva a revisar.')}
    </div>`;
  prev.style.display = '';
  setEstado(nuevas.length
    ? `Revisión lista: ${nuevas.length} por importar. Presiona "Importar".`
    : 'Revisión lista: no hay dispositivos nuevos que importar.', nuevas.length ? 'info' : 'warning');
}

async function revisarArchivo() {
  if (!_rolPuedeImportar) { setEstado('Tu rol no puede importar dispositivos.', 'warning'); return; }
  if (_ocupado) return;
  const archivo = document.getElementById('archivoExcel').files[0];
  if (!archivo) { setEstado('Selecciona un archivo .xlsx primero.', 'warning'); return; }
  _ocupado = true;
  const btnR = document.getElementById('btnRevisar');
  btnR.disabled = true;
  _invalidarRevision();
  try {
    setEstado('Leyendo el archivo…', 'info');
    await cargarXLSX();   // SheetJS bajo demanda
    const data = await archivo.arrayBuffer();
    const workbook = XLSX.read(data);
    const sheet = workbook.Sheets['BD'];
    if (!sheet) { setEstado('El archivo no tiene la hoja "BD".', 'error'); return; }
    const jsonData = XLSX.utils.sheet_to_json(sheet);
    if (!jsonData.length) { setEstado('La hoja "BD" está vacía.', 'warning'); return; }

    setEstado(`Comparando ${jsonData.length} filas contra la base actual…`, 'info');
    const existentesDocs = await PocService.getPocDevices();
    const serialesEnBase = new Set(
      existentesDocs
        .filter(d => !d.deleted)
        .map(d => String(d.serial || '').trim().toUpperCase())
        .filter(s => s && s !== 'N/D')
    );

    const vistos = new Set();
    const rev = { nuevas: [], existentes: [], repetidas: [], sinSerial: [], nombre: archivo.name };
    for (const fila of jsonData) {
      const serial = String(fila['SERIAL'] ?? '').trim();
      const norm = serial.toUpperCase();
      if (!serial || norm === 'N/D') { rev.sinSerial.push(fila); continue; }
      if (serialesEnBase.has(norm)) { rev.existentes.push(serial); continue; }
      if (vistos.has(norm)) { rev.repetidas.push(serial); continue; }
      vistos.add(norm);
      rev.nuevas.push(fila);
    }
    _revision = rev;
    _pintarRevision();
  } catch (e) {
    console.error('Error al revisar:', e);
    setEstado('No se pudo revisar el archivo: ' + (e.message || e), 'error');
  } finally {
    _ocupado = false;
    btnR.disabled = false;
    document.getElementById('btnImportar').disabled = !(_revision && _revision.nuevas.length);
  }
}

async function importarRevisadas() {
  if (!_rolPuedeImportar || _ocupado) return;
  if (!_revision || !_revision.nuevas.length) { setEstado('Primero revisa el archivo.', 'warning'); return; }
  _ocupado = true;
  const btnR = document.getElementById('btnRevisar');
  const btnI = document.getElementById('btnImportar');
  btnR.disabled = true; btnI.disabled = true;
  const filas = _revision.nuevas;
  let contador = 0;
  try {
    for (const fila of filas) {
      const serialValue = String(fila['SERIAL']).trim();

      const grupos = Object.keys(fila)
        .filter(k => k.startsWith('GRUPO ') && fila[k])
        .map(k => fila[k].toString().trim())
        .filter(g => g.length > 0);

      // Las celdas numéricas del Excel llegan como number — se fuerzan a string
      // (los unit_id numéricos rompían el orden en Firestore: ordena por tipo).
      const txt = v => (v ?? '').toString().trim();
      const unitId = txt(fila['UNIT ID']);

      const nuevoRef = await PocService.addPocDevice({
        cliente: txt(fila['CLIENTE']),
        operador: txt(fila['OPERADOR']),
        sim_number: txt(fila['# SIMCARD']),
        sim_phone: txt(fila['# TEL SIMCARD']),
        serial: serialValue,
        gps: (fila['GPS'] || '').toString().toLowerCase().includes('true'),
        activo: (fila['ACTIVO'] || '').toString().toUpperCase() !== 'NO',
        ip: txt(fila['IP del Servidor']),
        unit_id: unitId,
        unit_id_num: PocService.unitIdNum(unitId),
        radio_name: txt(fila['Nombre del Radio']),
        grupos,
        notas: fila['DAÑOS'] || '',
        deleted: false,
        created_at: firebase.firestore.FieldValue.serverTimestamp(),
        updated_at: firebase.firestore.FieldValue.serverTimestamp()
      });

      // Si el SIM importado existe disponible en el pool, marcarlo asignado
      // (consistencia con POC → SIM cards). Best-effort, no frena el import.
      if (fila['# SIMCARD']) {
        SimCardsService.marcarAsignadoSiExiste(fila['# SIMCARD'], {
          id: nuevoRef.id, serial: serialValue, cliente_nombre: fila['CLIENTE'] || '',
        }, firebase.auth().currentUser);
      }

      contador++;
      if (contador % 5 === 0 || contador === filas.length) {
        setEstado(`Importando… ${contador}/${filas.length}`, 'info');
      }
    }
    setEstado(`Importación completada: ${contador} dispositivos nuevos.`, 'success');
  } catch (e) {
    // Import PARCIAL visible (antes un fallo a mitad quedaba en silencio):
    // lo ya escrito queda; re-revisar el archivo lo detecta como existente.
    console.error('Error importando:', e);
    setEstado(`Importación PARCIAL: entraron ${contador} de ${filas.length}. Vuelve a "Revisar archivo" — lo ya importado se omitirá. Detalle: ${e.message || e}`, 'error');
  } finally {
    _ocupado = false;
    btnR.disabled = false;
    // La revisión quedó consumida: exigir re-revisión antes de otro import
    // (es el candado contra el doble click y contra importar dos veces).
    _invalidarRevision();
  }
}

async function exportarDispositivos() {
  setEstado("Exportando dispositivos…", "info");
  try {
    await cargarXLSX();   // SheetJS bajo demanda
    const datos = await PocService.getPocDevices();
    const ws = XLSX.utils.json_to_sheet(datos);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, "Dispositivos");
    XLSX.writeFile(wb, "poc_dispositivos.xlsx");
    setEstado("Exportación completada.", "success");
  } catch (error) {
    console.error("Error al exportar:", error);
    setEstado("Error al exportar.", "error");
  }
}
</script>
  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    // Rail Command Center (F5) — espera auth (scripts defer) y pinta el rail del rol efectivo.
    document.addEventListener('DOMContentLoaded', () => Layout.initRail('poc'));
  </script>
</body>
</html>
