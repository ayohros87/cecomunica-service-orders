<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <!-- Fuentes self-hosted: preload de los 2 pesos above-the-fold (crossorigin
       es obligatorio en preload de fuentes aunque sea mismo origen). -->
  <link rel="preload" href="/brand/fonts/ibm-plex-sans-400-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/brand/fonts/barlow-700-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Almacén - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=bf320539">
  <link rel="stylesheet" href="../css/ceco-rail.css?v=dc265958">
  <link rel="stylesheet" href="../css/ws-tabs.css?v=e58bb970">
  <link rel="stylesheet" href="../css/bandeja.css?v=0a2d7aa4">

  <style>
    /* La bandeja "Hoy" y la cola de "Asignar" usan el kit de bandeja
       (css/bandeja.css, js/ui/bandeja.js) desde 2026-09-07; aquí solo queda
       lo propio de la página. */

    /* El loader del kit vive en el flujo (min-height 200px) y empujaba los
       títulos hacia abajo mientras cargaba cada pestaña. Aquí es un overlay
       fijo: aparece y desaparece sin mover una sola línea del layout. */
    #loader {
      position: fixed; inset: 0; min-height: 0; z-index: 60;
      pointer-events: none; background: transparent;
    }

    /* Existencias (E2) — fila expandible + chips de serial con punto de estado */
    tr.ex-fila td { font-variant-numeric: tabular-nums; }
    tr.ex-fila.is-abierta td { background: var(--surface-sunken); }
    tr.ex-expansion > td {
      background: var(--surface-sunken); padding: 10px 14px 12px;
      border-bottom: 2px solid var(--border-default);
    }
    .ex-bloque { margin-bottom: 8px; }
    .ex-bloque:last-of-type { margin-bottom: 0; }
    .ex-bloque-t {
      display: block; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: .07em; color: var(--fg-3); margin-bottom: 4px;
    }
    .ex-serial {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      margin: 0 4px 4px 0; padding: 2px 9px;
      background: var(--surface-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-pill);
      font-family: var(--mono, monospace); font-size: 11.5px; color: var(--fg-1, inherit);
    }
    .ex-serial:hover { border-color: var(--accent); color: var(--accent); }
    .ex-serial i {
      width: 7px; height: 7px; border-radius: 50%; display: block;
      background: var(--fg-4);
    }
    /* Un solo color por estado (auditoría UX 2026-09-28, T1): los puntos toman
       el color de texto de los chips .eqpool-chip-* (ceco-ui.css). Antes taller
       era morado aquí y amarillo en el chip, y baja roja aquí y gris allá. Si
       cambia la paleta del chip, cambia este mapa también. */
    .ex-serial[data-dot="en_bodega"] i         { background: #15803d; }
    .ex-serial[data-dot="asignado_contrato"] i { background: #1d4ed8; }
    .ex-serial[data-dot="en_cliente"] i        { background: #4338ca; }
    .ex-serial[data-dot="en_taller"] i         { background: #a16207; }
    .ex-serial[data-dot="devuelto_revision"] i { background: #c2410c; }
    .ex-serial[data-dot="por_clasificar"] i    { background: #9f1239; }
    .ex-serial[data-dot="vendido"] i           { background: #0f766e; }
    .ex-serial[data-dot="pendiente_cobro"] i   { background: #b91c1c; }
    .ex-serial[data-dot="no_retirado"] i       { background: #6d28d9; }
    .ex-serial[data-dot="baja"] i              { background: #64748b; }
    .ex-serial[data-dot="en_poc"] i            { background: #64748b; }
    .ex-mas { font-size: 12px; margin-left: 4px; white-space: nowrap; }
    .ex-expansion-pie { margin-top: 8px; font-size: 12.5px; }

    /* Asignar (propuesta "Asignar desde Almacén" 2026-09-03): cola a la
       izquierda, trabajo a la derecha. El encabezado dice qué sacar del
       estante, no quién es el cliente. */
    .as-layout { display: grid; grid-template-columns: 320px minmax(0, 1fr); gap: var(--sp-4); align-items: start; }
    @media (max-width: 860px) { .as-layout { grid-template-columns: 1fr; } }
    /* La cola es una .bj-lista del kit; aquí solo su posición pegajosa. */
    .as-cola { position: sticky; top: 8px; max-height: calc(100vh - 120px); overflow-y: auto; }
    .as-work {
      background: var(--surface-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); padding: var(--sp-4); min-height: 320px; position: relative;
    }
    .as-work-h { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: var(--sp-3); }
    .as-work-t { font-family: var(--font-display); font-weight: 700; font-size: 20px; color: var(--fg-1); line-height: 1.15; }
    .as-work-s { font-size: 12.5px; color: var(--fg-3); margin-top: 2px; }
    .as-picklist { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 var(--sp-3); }
    .as-pl { border: 1px solid var(--border-default); border-radius: var(--radius-sm, 6px); padding: 6px 10px; background: var(--surface-card); }
    .as-pl b { font-family: var(--font-display); font-size: 15px; color: var(--fg-1); }
    .as-pl small { display: block; color: var(--fg-3); font-size: 11.5px; }
    .as-pl.short { border-color: #F59E0B; }
    .as-pl.short small { color: #92400E; }
    .as-toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: var(--sp-3); }
    .as-toolbar:empty { display: none; }
    .as-foot {
      display: flex; align-items: center; gap: 10px; position: sticky; bottom: 0;
      margin: var(--sp-3) calc(-1 * var(--sp-4)) calc(-1 * var(--sp-4));
      padding: 10px var(--sp-4); background: var(--surface-card);
      border-top: 1px solid var(--border-default); border-radius: 0 0 var(--radius-md) var(--radius-md);
    }
    .as-foot-prog { font-family: var(--font-mono, monospace); color: var(--fg-1); font-variant-numeric: tabular-nums; }
    /* Filas del formulario compartido (mismas clases que contratos/seriales) */
    .serial-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
    .serial-row.bloqueado .serial-input { background: var(--surface-sunken); color: var(--fg-3); }
    .serial-num { width: 24px; text-align: right; color: var(--fg-3); font-size: 12px; }
    .serial-input { height: 36px; flex: 1; min-width: 180px; font-family: var(--font-mono, monospace); }
    .serial-input.dup { border-color: #dc2626 !important; background: #fef2f2; }
    .serial-input.reemplazo { border-color: #2563eb !important; background: #eff6ff; box-shadow: 0 0 0 2px rgba(37,99,235,.15); }
    .serial-omit { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--fg-3); white-space: nowrap; cursor: pointer; }
    .motivo-input { flex-basis: 100%; margin-left: 32px; height: 34px; font-size: 13px; }

    /* .badge: kit (ceco-ui.css) */
  </style>

        <!-- functions-compat: fusionar fichas en conflicto (callable fusionarPoolFicha) -->
      <script src="../js/core/modulos.js?v=1838cd29"></script>
  <script src="../js/core/layout.js?v=68295191"></script>
  <script src="../js/core/roles.js?v=7a4f1b6f"></script>
  <script src="../js/core/formatting.js?v=b2dcba44"></script> <!-- FMT: lo usan los asistentes -->
   <!-- confirmaciones de los asistentes + Modal.sheet -->
   <!-- kit de bandeja: fila, grupo, antigüedad -->
         <!-- cola de Conflictos, compartida con Equipos por serial -->
        <script src="../js/core/serial.js?v=37e4721b"></script> <!-- identidad de serial (Serial.norm), antes de los servicios -->
        <!-- Síncrono a propósito: las pestañas se pintan en el parse (ver abajo)
       para que no aparezcan tarde empujando el contenido. -->
  <script src="../js/ui/workspace-tabs.js?v=2cf7489c"></script>
  <script src="../js/ui/almacen-nav.js?v=5aade324"></script>
               <!-- lo usa el importador -->
     <!-- autocomplete del asistente de venta -->
   <!-- SheetJS BAJO DEMANDA -->
  <!-- Asignar: contratos (subcolección seriales) + gestiones, formulario compartido -->
  <script type="module" src="/js/entry/almacen-index.js"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbar({
      title: '<i data-lucide="warehouse"></i> Almacén',
      actions: [
        { label: '<i data-lucide="file-spreadsheet"></i> Importar hoja', cls: 'primary',
          onclick: "AlmacenPage.abrirImportar()" },
        { label: '<i data-lucide="plus"></i> Recibir equipos',
          onclick: "AlmacenPage.abrirRecibir()" },
        { label: '<i data-lucide="clipboard-list"></i> Conteo físico',
          onclick: "AlmacenPage.abrirConteo()" },
        { label: '<i data-lucide="banknote"></i> Registrar venta',
          onclick: "AlmacenPage.abrirVenta()" },
      ],
      menu: [
        { onclick: 'AlmacenPage.recargar()', label: '<i data-lucide="refresh-cw"></i> Recargar' },
        { divider: true },
        { href: '../inventario/equipos.html?volver=almacen', label: '<i data-lucide="scan-barcode"></i> Equipos por serial (avanzado)' },
      ],
      showHome: true, homeHref: '../index.html', showLogout: true
    });
  </script>

  <div id="loader" style="display:none;" class="loader-center">
    <div class="loader"></div>
  </div>

  <div class="app-wrap app-wrap--full" id="bodyAlmacen">

    <div id="wsTabs-mount"></div>
    <script>
      // Pintado EN EL PARSE (no en DOMContentLoaded ni tras auth): la barra
      // sale en el primer frame y el contenido no brinca. Los onclick se
      // evalúan al hacer clic, cuando almacen-hoy.js (defer) ya cargó.
      // Definición única en js/ui/almacen-nav.js (la comparten Piezas,
      // Descartados, Con condición y No devueltos). Aquí `enPagina` convierte
      // Hoy/Asignar/Existencias en cambios de sección, sin recargar.
      AlmacenNav.render('hoy', { enPagina: true });
    </script>

    <!-- ============ HOY — bandeja unificada de trabajo ============ -->
    <section id="tab-hoy">
      <div id="avisoFallidas" class="bj-aviso" style="display:none;"></div>
      <div id="hoyGrupos"></div>
      <div class="bj-vacio" id="hoyVacio" style="display:none;">
        <i data-lucide="check-circle-2"></i>
        <p>Nada pendiente. Bodega al día.</p>
      </div>
    </section>

    <!-- ============ ASIGNAR — seriales a contratos y gestiones ============ -->
    <section id="tab-asignar" style="display:none;">
      <div class="as-layout">
        <aside class="bj-lista as-cola" id="asCola" aria-label="Cola por asignar"></aside>
        <section class="as-work" id="asTrabajo"></section>
      </div>
    </section>

    <!-- ============ EXISTENCIAS — grid unificado modelo → serial → ficha ============ -->
    <section id="tab-existencias" style="display:none;">

      <div class="kpi-grid" style="margin:0 0 var(--sp-4);">
        <div class="kpi-card">
          <span class="kpi-card-label">En bodega</span>
          <span class="kpi-card-value kpi-accent" id="exKpiBodega">—</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Con clientes</span>
          <span class="kpi-card-value" id="exKpiCliente">—</span>
          <span class="kpi-card-sub">asignados + entregados</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">En taller</span>
          <span class="kpi-card-value" id="exKpiTaller">—</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Devuelto · por inspeccionar</span>
          <span class="kpi-card-value" id="exKpiCuarentena">—</span>
          <span class="kpi-card-sub">esperan inspección de bodega</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Modelos con diferencia</span>
          <span class="kpi-card-value" id="exKpiDif">—</span>
          <span class="kpi-card-sub">registro vs conteo · meta: 0</span>
        </div>
      </div>

      <div class="ds-card">
        <div class="filter-bar">
          <div class="filter-search" style="max-width:360px;">
            <span class="search-icon"><i data-lucide="search"></i></span>
            <input id="exBuscador" type="search"
              placeholder="Modelo… o serial (Enter abre la ficha)"
              aria-label="Buscar modelo o serial"
              oninput="AlmacenExistencias.onBuscar(this.value)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();AlmacenExistencias.onBuscarEnter();}">
          </div>
          <select class="cc-input" style="max-width:190px;" aria-label="Filtrar por estado"
            onchange="AlmacenExistencias.setFiltroEstado(this.value)">
            <option value="">Con unidades en…</option>
            <option value="en_bodega">Bodega</option>
            <option value="asignado_contrato">Asignado</option>
            <option value="en_cliente">En cliente</option>
            <option value="en_taller">Taller</option>
            <option value="devuelto_revision">Devuelto · por inspeccionar</option>
            <option value="otros">Otros (venta/baja/clasificar/no retirado)</option>
          </select>
          <label class="toggle-pill"><input type="checkbox" onchange="AlmacenExistencias.toggleSoloDif(this)"> Solo con diferencia</label>
          <div style="flex:1;"></div>
          <button class="btn btn-sm" onclick="AlmacenExistencias.copiarReporte()"><i data-lucide="mail"></i> Copiar reporte</button>
          <button class="btn btn-sm" onclick="AlmacenExistencias.exportarExcel()"><i data-lucide="download"></i> Excel</button>
        </div>
        <div class="app-table-wrap app-table-wrap--sticky" style="border:none; box-shadow:none; border-radius:0;">
          <table class="app-table">
            <thead>
              <tr>
                <th>Modelo</th>
                <th style="text-align:right;">Bodega</th>
                <th style="text-align:right;">Asignado</th>
                <th style="text-align:right;">Cliente</th>
                <th style="text-align:right;">Taller</th>
                <th style="text-align:right;" title="Devuelto · por inspeccionar">Devueltos</th>
                <th style="text-align:right;" title="Vendidos, bajas, por clasificar, no devueltos y no retirados">Otros</th>
                <th style="text-align:right;">Conteo</th>
                <th style="text-align:right;" title="Bodega − conteo físico (meta 0)">Dif.</th>
                <th style="text-align:right;">Últ. conteo</th>
              </tr>
            </thead>
            <tbody id="exTabla"></tbody>
          </table>
        </div>
        <div class="app-table-footer">
          <p id="exResumen" class="resumen" style="margin:0;"></p>
        </div>
      </div>
    </section>

    <script>
      // Deep-link ?tab=existencias resuelto EN EL PARSE (las secciones ya
      // existen aquí): la pestaña correcta desde el primer frame, sin brinco.
      // Los datos los carga init() cuando el auth resuelve.
      (function () {
        const tab = new URLSearchParams(location.search).get('tab');
        if (tab !== 'existencias' && tab !== 'asignar') return;
        document.getElementById('tab-hoy').style.display = 'none';
        document.getElementById('tab-' + tab).style.display = '';
        WorkspaceTabs.setActive(tab);
      })();
    </script>

  </div>

  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    document.addEventListener('DOMContentLoaded', () => Layout.initRail('almacen'));
  </script>
</body>
</html>
