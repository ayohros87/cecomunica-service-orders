<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <!-- Fuentes self-hosted: preload de los 2 pesos above-the-fold (crossorigin
       es obligatorio en preload de fuentes aunque sea mismo origen). -->
  <link rel="preload" href="/brand/fonts/ibm-plex-sans-400-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/brand/fonts/barlow-700-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Almacén - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=cc24">
  <link rel="stylesheet" href="../css/ceco-rail.css?v=cc7">
  <link rel="stylesheet" href="../css/ws-tabs.css">

  <style>
    /* Page-local — bandeja "Hoy" (propuesta Almacén/Finanzas 2026-08, E1). */
    .hy-grupo { margin-bottom: var(--sp-5); }
    .hy-grupo-t {
      display: flex; align-items: center; gap: 8px;
      font-size: 11.5px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase;
      color: var(--fg-3); margin: 0 0 8px;
    }
    .hy-grupo-t .hy-n {
      background: var(--surface-sunken); border-radius: 999px; padding: 0 8px;
      font-size: 11px; letter-spacing: 0;
    }
    .hy-row {
      display: flex; align-items: center; gap: 10px; min-width: 0;
      background: var(--surface-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-md); padding: 8px 12px; margin-bottom: 6px;
    }
    .hy-txt { flex: 1; min-width: 0; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .hy-txt b { font-weight: 600; }
    .hy-chip {
      flex: none; font-size: 11px; font-weight: 700; border-radius: 999px; padding: 2px 9px;
      white-space: nowrap;
    }
    .hy-chip--seriales   { background: #FEF3C7; color: #92400E; }
    .hy-chip--cambio     { background: #EFF6FF; color: #1E3A8A; }
    .hy-chip--transicion { background: #FFEDD5; color: #7C2D12; }
    .hy-chip--inspeccion { background: #FEF3C7; color: #92400E; }
    .hy-chip--clasificar { background: var(--surface-sunken); color: var(--fg-3); }
    .hy-chip--conflicto  { background: #FEF2F2; color: #991B1B; }
    .hy-chip--diferencia { background: #FEF2F2; color: #991B1B; }
    .hy-age { flex: none; font-size: 12px; color: var(--fg-3); white-space: nowrap; }
    .hy-age.warn { color: #92400E; font-weight: 600; }
    .hy-age.bad  { color: #991B1B; font-weight: 600; }
    .hy-cta { flex: none; white-space: nowrap; }
    .hy-mas { font-size: 12.5px; margin: 2px 0 0 4px; }
    .hy-nota { font-size: 12px; color: var(--fg-3); margin: 4px 0 0 4px; }
    .hy-eq {
      display: inline-block; margin: 0 4px 0 0; padding: 0 7px;
      background: var(--surface-sunken); border: 1px solid var(--border-subtle);
      border-radius: var(--radius-pill); font-size: 12px; white-space: nowrap;
    }
    .hy-aviso {
      display: flex; align-items: center; gap: 8px; margin-bottom: var(--sp-3);
      padding: 9px 12px; border-radius: var(--radius-md); font-size: 13px;
      background: #FEF2F2; color: #991B1B; border: 1px solid #FECACA;
    }
    .hy-vacio { text-align: center; color: var(--fg-3); padding: var(--sp-6); }
    .hy-vacio svg { width: 34px; height: 34px; color: #16A34A; }

    /* El loader del kit vive en el flujo (min-height 200px) y empujaba los
       títulos hacia abajo mientras cargaba cada pestaña. Aquí es un overlay
       fijo: aparece y desaparece sin mover una sola línea del layout. */
    #loader {
      position: fixed; inset: 0; min-height: 0; z-index: 60;
      pointer-events: none; background: transparent;
    }

    /* Existencias (E2) — fila expandible + chips de serial con punto de estado */
    tr.ex-fila td { font-variant-numeric: tabular-nums; }
    tr.ex-fila.is-abierta td { background: var(--surface-sunken); }
    tr.ex-expansion > td {
      background: var(--surface-sunken); padding: 10px 14px 12px;
      border-bottom: 2px solid var(--border-default);
    }
    .ex-bloque { margin-bottom: 8px; }
    .ex-bloque:last-of-type { margin-bottom: 0; }
    .ex-bloque-t {
      display: block; font-size: 10.5px; text-transform: uppercase;
      letter-spacing: .07em; color: var(--fg-3); margin-bottom: 4px;
    }
    .ex-serial {
      display: inline-flex; align-items: center; gap: 6px; cursor: pointer;
      margin: 0 4px 4px 0; padding: 2px 9px;
      background: var(--surface-card); border: 1px solid var(--border-default);
      border-radius: var(--radius-pill);
      font-family: var(--mono, monospace); font-size: 11.5px; color: var(--fg-1, inherit);
    }
    .ex-serial:hover { border-color: var(--accent); color: var(--accent); }
    .ex-serial i {
      width: 7px; height: 7px; border-radius: 50%; display: block;
      background: var(--fg-4);
    }
    .ex-serial[data-dot="en_bodega"] i         { background: #16A34A; }
    .ex-serial[data-dot="asignado_contrato"] i { background: #2563EB; }
    .ex-serial[data-dot="en_cliente"] i        { background: #0891B2; }
    .ex-serial[data-dot="en_taller"] i         { background: #7C3AED; }
    .ex-serial[data-dot="devuelto_revision"] i { background: #D97706; }
    .ex-serial[data-dot="vendido"] i           { background: #64748B; }
    .ex-serial[data-dot="baja"] i              { background: #991B1B; }
    .ex-serial[data-dot="por_clasificar"] i    { background: #9F1239; }
    .ex-mas { font-size: 12px; margin-left: 4px; white-space: nowrap; }
    .ex-expansion-pie { margin-top: 8px; font-size: 12.5px; }

    /* Badges Dif. (mismo alias del tablero de Inventario) */
    .badge {
      display: inline-flex; align-items: center; justify-content: center;
      border-radius: 999px; padding: 0 8px; height: 22px;
      font-size: 12px; font-weight: 600; border: 1px solid transparent;
    }
    .badge.completo  { background:#ECFDF5; color:#065F46; border-color:#A7F3D0; }
    .badge.pendiente { background:#FFFBEB; color:#92400E; border-color:#FDE68A; }
    .badge.danger    { background:#FEF2F2; color:#991B1B; border-color:#FECACA; }
  </style>

  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <!-- functions-compat: fusionar fichas en conflicto (callable fusionarPoolFicha) -->
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-functions-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=ses2"></script>
  <script src="../js/core/modulos.js"></script>
  <script src="../js/core/layout.js?v=cc11"></script>
  <script src="../js/core/roles.js"></script>
  <script src="../js/core/formatting.js"></script> <!-- FMT: lo usan los asistentes -->
  <script defer src="../js/ui/modal.js"></script> <!-- confirmaciones de los asistentes -->
  <script defer src="../js/services/usuariosService.js"></script>
  <script defer src="../js/domain/transicionPendiente.js"></script>
  <script defer src="../js/services/colaInventarioService.js?v=cc2"></script>
  <script defer src="../js/services/modelosService.js"></script>
  <script defer src="../js/services/inventarioService.js"></script>
  <script defer src="../js/services/equiposPoolService.js?v=cc27"></script>
  <script defer src="../js/domain/stockAgg.js"></script>
  <script defer src="../js/ui/toast.js"></script>
  <!-- Síncrono a propósito: las pestañas se pintan en el parse (ver abajo)
       para que no aparezcan tarde empujando el contenido. -->
  <script src="../js/ui/workspace-tabs.js"></script>
  <script defer src="../js/ui/equipo-ficha.js?v=cc2"></script>
  <script defer src="../js/ui/asistente-conteo.js?v=fix1"></script>
  <script defer src="../js/ui/asistente-recibir.js?v=cc27"></script>
  <script defer src="../js/ui/asistente-venta.js?v=fix1"></script>
  <script defer src="../js/domain/serialPatron.js?v=cc27"></script> <!-- lo usa el importador -->
  <script defer src="../js/ui/asistente-importar.js?v=cc27"></script>
  <script defer src="../js/services/clientesService.js"></script> <!-- autocomplete del asistente de venta -->
  <script defer src="../js/core/xlsx-loader.js"></script> <!-- SheetJS BAJO DEMANDA -->
  <script defer src="../js/pages/almacen-hoy.js"></script>
  <script defer src="../js/pages/almacen-existencias.js?v=fix1"></script>
  <script defer src="/js/vendor/lucide.min.js?v=1"></script>
  <script defer src="/js/core/icons.js?v=1"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbar({
      title: '<i data-lucide="warehouse"></i> Almacén',
      actions: [
        { label: '<i data-lucide="file-spreadsheet"></i> Importar hoja', cls: 'primary',
          onclick: "AlmacenPage.abrirImportar()" },
        { label: '<i data-lucide="plus"></i> Recibir equipos',
          onclick: "AlmacenPage.abrirRecibir()" },
        { label: '<i data-lucide="clipboard-list"></i> Conteo físico',
          onclick: "AlmacenPage.abrirConteo()" },
        { label: '<i data-lucide="banknote"></i> Registrar venta',
          onclick: "AlmacenPage.abrirVenta()" },
      ],
      menu: [
        { onclick: 'AlmacenPage.recargar()', label: '<i data-lucide="refresh-cw"></i> Recargar' },
        { divider: true },
        { href: '../inventario/equipos.html?volver=almacen', label: '<i data-lucide="scan-barcode"></i> Equipos por serial (avanzado)' },
      ],
      showHome: true, homeHref: '../index.html', showLogout: true
    });
  </script>

  <div id="loader" style="display:none;" class="loader-center">
    <div class="loader"></div>
  </div>

  <div class="app-wrap app-wrap--full" id="bodyAlmacen">

    <div id="wsTabs-mount"></div>
    <script>
      // Pintado EN EL PARSE (no en DOMContentLoaded ni tras auth): la barra
      // sale en el primer frame y el contenido no brinca. Los onclick se
      // evalúan al hacer clic, cuando almacen-hoy.js (defer) ya cargó.
      WorkspaceTabs.render('wsTabs-mount', {
        active: 'hoy',
        tabs: [
          { id: 'hoy', label: 'Hoy', icon: 'inbox', onclick: "AlmacenPage.setTab('hoy')" },
          { id: 'existencias', label: 'Existencias', icon: 'package', onclick: "AlmacenPage.setTab('existencias')" },
          { id: 'piezas', label: 'Piezas', icon: 'puzzle', href: '../inventario/piezas.html' },
        ],
      });
    </script>

    <!-- ============ HOY — bandeja unificada de trabajo ============ -->
    <section id="tab-hoy">
      <div id="avisoFallidas" class="hy-aviso" style="display:none;"></div>
      <div id="hoyGrupos"></div>
      <div class="hy-vacio" id="hoyVacio" style="display:none;">
        <i data-lucide="check-circle-2"></i>
        <p>Nada pendiente. Bodega al día.</p>
      </div>
    </section>

    <!-- ============ EXISTENCIAS — grid unificado modelo → serial → ficha ============ -->
    <section id="tab-existencias" style="display:none;">

      <div class="kpi-grid" style="margin:0 0 var(--sp-4);">
        <div class="kpi-card">
          <span class="kpi-card-label">En bodega</span>
          <span class="kpi-card-value kpi-accent" id="exKpiBodega">—</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Con clientes</span>
          <span class="kpi-card-value" id="exKpiCliente">—</span>
          <span class="kpi-card-sub">asignados + entregados</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">En taller</span>
          <span class="kpi-card-value" id="exKpiTaller">—</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Cuarentena</span>
          <span class="kpi-card-value" id="exKpiCuarentena">—</span>
          <span class="kpi-card-sub">devueltos por inspeccionar</span>
        </div>
        <div class="kpi-card">
          <span class="kpi-card-label">Modelos con diferencia</span>
          <span class="kpi-card-value" id="exKpiDif">—</span>
          <span class="kpi-card-sub">pool vs conteo · meta: 0</span>
        </div>
      </div>

      <div class="ds-card">
        <div class="filter-bar">
          <div class="filter-search" style="max-width:360px;">
            <span class="search-icon"><i data-lucide="search"></i></span>
            <input id="exBuscador" type="search"
              placeholder="Modelo… o serial (Enter abre la ficha)"
              aria-label="Buscar modelo o serial"
              oninput="AlmacenExistencias.onBuscar(this.value)"
              onkeydown="if(event.key==='Enter'){event.preventDefault();AlmacenExistencias.onBuscarEnter();}">
          </div>
          <select class="cc-input" style="max-width:190px;" aria-label="Filtrar por estado"
            onchange="AlmacenExistencias.setFiltroEstado(this.value)">
            <option value="">Con unidades en…</option>
            <option value="en_bodega">Bodega</option>
            <option value="asignado_contrato">Asignado</option>
            <option value="en_cliente">En cliente</option>
            <option value="en_taller">Taller</option>
            <option value="devuelto_revision">Cuarentena</option>
            <option value="otros">Otros (venta/baja/clasificar)</option>
          </select>
          <label class="toggle-pill"><input type="checkbox" onchange="AlmacenExistencias.toggleSoloDif(this)"> Solo con diferencia</label>
          <div style="flex:1;"></div>
          <button class="btn btn-sm" onclick="AlmacenExistencias.copiarReporte()"><i data-lucide="mail"></i> Copiar reporte</button>
          <button class="btn btn-sm" onclick="AlmacenExistencias.exportarExcel()"><i data-lucide="download"></i> Excel</button>
        </div>
        <div class="app-table-wrap app-table-wrap--sticky" style="border:none; box-shadow:none; border-radius:0;">
          <table class="app-table">
            <thead>
              <tr>
                <th>Modelo</th>
                <th style="text-align:right;">Bodega</th>
                <th style="text-align:right;">Asignado</th>
                <th style="text-align:right;">Cliente</th>
                <th style="text-align:right;">Taller</th>
                <th style="text-align:right;">Cuarent.</th>
                <th style="text-align:right;" title="Vendidos, bajas y por clasificar">Otros</th>
                <th style="text-align:right;">Conteo</th>
                <th style="text-align:right;" title="Bodega − conteo físico (meta 0)">Dif.</th>
                <th style="text-align:right;">Últ. conteo</th>
              </tr>
            </thead>
            <tbody id="exTabla"></tbody>
          </table>
        </div>
        <div class="app-table-footer">
          <p id="exResumen" class="resumen" style="margin:0;"></p>
        </div>
      </div>
    </section>

    <script>
      // Deep-link ?tab=existencias resuelto EN EL PARSE (las secciones ya
      // existen aquí): la pestaña correcta desde el primer frame, sin brinco.
      // Los datos los carga init() cuando el auth resuelve.
      if (new URLSearchParams(location.search).get('tab') === 'existencias') {
        document.getElementById('tab-hoy').style.display = 'none';
        document.getElementById('tab-existencias').style.display = '';
        WorkspaceTabs.setActive('existencias');
      }
    </script>

  </div>

  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    document.addEventListener('DOMContentLoaded', () => Layout.initRail('almacen'));
  </script>
</body>
</html>
