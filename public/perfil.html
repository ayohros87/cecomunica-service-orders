<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Mi Perfil - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="css/ceco-ui.css?v=bf320539">
  <!-- Rediseño Command Center F5: rail lateral (híbrido). PLAN_REDISENO_COMMAND_CENTER.md -->
  <link rel="stylesheet" href="css/ceco-rail.css?v=dc265958">

  <!-- Firebase -->
          <script src="js/core/modulos.js?v=1838cd29"></script>
  <script src="js/core/layout.js?v=68295191"></script>
  <script type="module" src="/js/entry/perfil.js"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbarFor('edit', {
      title: '<i data-lucide="user"></i> Mi Perfil',
      back:  { href: 'index.html' }
    });
  </script>

  <div class="app-wrap app-wrap--narrow">

    <div class="ds-card ds-card-padded">
      <p class="form-section-title" style="margin-bottom:var(--sp-3);"><i data-lucide="user-circle"></i> Datos del usuario</p>
      <div class="form-grid-2">
        <div class="form-field" style="grid-column:1/-1;">
          <label class="form-label" for="perfil-nombre">Nombre</label>
          <input class="form-input" id="perfil-nombre" type="text" readonly>
        </div>
        <div class="form-field">
          <label class="form-label" for="perfil-correo">Correo electrónico</label>
          <div class="form-input-wrap">
            <span class="form-input-prefix"><i data-lucide="mail" style="width:15px;height:15px;"></i></span>
            <input class="form-input" id="perfil-correo" type="text" readonly>
          </div>
        </div>
        <div class="form-field">
          <label class="form-label" for="perfil-rol">Rol</label>
          <input class="form-input" id="perfil-rol" type="text" readonly>
        </div>
      </div>
    </div>

    <!-- Auditoría UX 2026-09-28 (4.1): el perfil era solo lectura y sin
         salida a lo personal. Ahora lleva a la firma de correo y permite
         pedir el cambio de contraseña al propio correo. -->
    <div class="ds-card ds-card-padded" style="margin-top:var(--sp-4);">
      <p class="form-section-title" style="margin-bottom:var(--sp-3);"><i data-lucide="settings-2"></i> Tu cuenta</p>
      <div style="display:flex; flex-wrap:wrap; gap:var(--sp-3);">
        <a class="btn btn-secondary" href="firma-correo.html"><i data-lucide="mail"></i> Mi firma de correo</a>
        <button type="button" class="btn btn-secondary" id="btnCambiarClave"><i data-lucide="key"></i> Cambiar contraseña</button>
      </div>
      <p class="form-hint" style="font-size:12px; color:var(--fg-4); margin:var(--sp-3) 0 0;">
        Para cambiar la contraseña te enviamos un enlace a tu correo; ábrelo y escribe la nueva.
      </p>
    </div>

  </div>

  <script>
    // Los scripts de Firebase cargan con defer: registrar tras DOMContentLoaded.
    document.addEventListener('DOMContentLoaded', () => {
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { location.href = "/login.html"; return; }

      document.getElementById("perfil-correo").value = user.email || "";

      try {
        const snap = await firebase.firestore().collection("usuarios").doc(user.uid).get();
        if (snap.exists) {
          const data = snap.data();
          document.getElementById("perfil-nombre").value = data.nombre || "";
          // Rol legible ("Recepción", no "recepcion"): misma tabla del rail.
          document.getElementById("perfil-rol").value = window.MODULOS
            ? MODULOS.rolLabel(data.rol) : (data.rol || "");
        }
      } catch (e) {
        console.error("Error al cargar perfil:", e);
      }
    });
    });

    function cerrarSesion() {
      firebase.auth().signOut().then(() => { location.href = "/login.html"; });
    }

    // Cambio de contraseña: enlace de Firebase al PROPIO correo, con
    // confirmación antes de enviarlo (no cierra la sesión actual).
    document.addEventListener('DOMContentLoaded', () => {
      const btn = document.getElementById('btnCambiarClave');
      if (!btn) return;
      btn.addEventListener('click', async () => {
        const user = firebase.auth().currentUser;
        const email = user && user.email;
        const avisar = (msg, tipo) => (window.Toast ? Toast.show(msg, tipo) : alert(msg));
        if (!email) { avisar('Tu cuenta no tiene correo: pídele a administración que te restablezca la contraseña.', 'warn'); return; }
        const texto = `Te enviaremos un enlace a ${email} para que escribas una contraseña nueva. ¿Lo enviamos?`;
        const ok = window.Modal && Modal.confirm
          ? await Modal.confirm({ title: 'Cambiar contraseña', message: texto, confirmLabel: 'Enviar enlace', cancelLabel: 'Cancelar' })
          : confirm(texto);
        if (!ok) return;
        btn.disabled = true;
        try {
          await firebase.auth().sendPasswordResetEmail(email);
          avisar(`Listo: revisa ${email} (también la carpeta de spam).`, 'ok');
        } catch (e) {
          console.error('[perfil] reset de contraseña:', e);
          avisar(e && e.code === 'auth/too-many-requests'
            ? 'Ya pediste varios enlaces seguidos. Espera unos minutos e intenta de nuevo.'
            : 'No se pudo enviar el enlace. Revisa tu conexión e intenta de nuevo.', 'bad');
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    // Rail Command Center (F5) — espera auth (scripts defer) y pinta el rail del rol efectivo.
    document.addEventListener('DOMContentLoaded', () => Layout.initRail(''));
  </script>
</body>
</html>
