<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Redirigiendo…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    // Redirect para bookmarks y para el buscador global. Desde 2026-09-03 la
    // edición individual vive en clientes/ficha.html (piloto del kit de
    // formularios); al guardar/volver aterriza en la ficha 360 del Centro.
    (function(){
      var p = new URLSearchParams(location.search);
      var id = p.get('id');
      var target = id
        ? ('./ficha.html?from=centro&id=' + encodeURIComponent(id))
        : './centro.html';
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirigiendo al formulario de cliente…</p>
</body>
</html>
