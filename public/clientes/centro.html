  <style>
    /* Centro de gestión (cg-*) — Ola 1 gestiones por cliente */
    .cg-tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:var(--sp-4); }
    .cg-buscar { flex:1; min-width:240px; max-width:480px; }
    .seg { display:inline-flex; border:1px solid var(--border-default); border-radius:var(--radius-pill); overflow:hidden; }
    .seg-btn { border:0; background:var(--surface-card); color:var(--fg-2); padding:5px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .seg-btn.is-on { background:var(--accent); color:#fff; }
    .seg-btn + .seg-btn { border-left:1px solid var(--border-default); }
    .cg-toggle { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-default);
                 border-radius:var(--radius-pill); padding:5px 14px; font-size:13px; font-weight:600;
                 color:var(--fg-2); background:var(--surface-card); cursor:pointer; user-select:none; }
    .cg-toggle input { width:auto; margin:0; accent-color: var(--accent); }
    .cg-row { display:flex; gap:14px; align-items:center; background:var(--surface-card); border:1px solid var(--border-subtle);
              border-radius:var(--radius-md); padding:11px 16px; margin-bottom:8px; cursor:pointer; text-decoration:none; color:inherit; }
    .cg-row:hover { border-color:var(--accent); }
    .cg-av { width:38px; height:38px; border-radius:10px; background:var(--navy); color:#fff; display:grid; place-items:center;
             font-weight:700; font-size:14px; flex:none; }
    .cg-row .n { font-weight:600; font-size:14.5px; }
    .cg-row .s { font-size:12.5px; color:var(--fg-3); }
    .cg-row .arr { margin-left:auto; color:var(--fg-4); font-size:18px; font-weight:600; }
    .cg-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:var(--sp-4) 0; }
    @media (max-width:760px){ .cg-kpis { grid-template-columns:1fr 1fr; } }
    .cg-kpi { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 15px; }
    .cg-kpi .v { font-size:22px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; line-height:1.1; }
    .cg-kpi .l { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); font-weight:600; margin-top:4px; }
    .cg-senal { display:flex; gap:8px; align-items:flex-start; border-radius:8px; padding:9px 13px; font-size:13px; margin-bottom:8px; }
    .cg-senal.warn { background:var(--soft-warn, #FBF3E0); color:#8A6415; }
    .cg-senal.bad  { background:var(--soft-bad, #FBE9E9); color:#A03030; }
    .cg-senal.info { background:var(--accent-soft, #E6F4FB); color:#0B5E8A; }
    .cg-vida { min-width:150px; }
    .cg-vida .lbl { font-size:12.5px; font-weight:700; display:block; line-height:1.2; }
    .cg-vida .sub { font-size:11px; color:var(--fg-4); }
    .cg-vida .bar { height:5px; border-radius:999px; background:var(--surface-sunken, #EEF2F6); overflow:hidden; margin-top:4px; max-width:160px; }
    .cg-vida .bar i { display:block; height:100%; border-radius:999px; }
    .cg-venc { font-size:12px; font-weight:600; border-radius:999px; padding:1px 9px; white-space:nowrap; }
    .cg-venc.vigente { background:#E4F5EC; color:#17714B; }
    .cg-venc.por_vencer { background:#FBF3E0; color:#8A6415; }
    .cg-venc.vencido { background:#FBE9E9; color:#A03030; }
    .cg-tabla { width:100%; border-collapse:collapse; font-size:13.5px; }
    .cg-tabla th { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--fg-3); text-align:left;
                   padding:8px 12px; border-bottom:1px solid var(--border-subtle); white-space:nowrap; }
    .cg-tabla td { padding:9px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; }
    .cg-tabla tr:last-child td { border-bottom:none; }
    .cg-twrap { overflow-x:auto; }
    .cg-mono { font-family:var(--font-mono, ui-monospace); font-size:.93em; }
    .cg-head { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
    .cg-acts { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; position:relative; }
    .cg-menu { position:absolute; right:0; top:calc(100% + 6px); background:var(--surface-card); border:1px solid var(--border-default);
               border-radius:10px; box-shadow:0 10px 30px -12px rgba(11,42,71,.25); min-width:250px; z-index:50;
               max-height:70vh; overflow:auto; }
    .cg-menu .hd { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--fg-4); padding:8px 14px 3px; }
    .cg-menu a, .cg-menu button { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--border-subtle);
               padding:9px 14px; font-size:13.5px; color:var(--fg-1); text-decoration:none; cursor:pointer; }
    .cg-menu a:hover, .cg-menu button:hover { background:var(--accent-soft, #E6F4FB); }
    .cg-menu .off { color:var(--fg-4); cursor:not-allowed; }
    .cg-menu .off:hover { background:none; }
    .cg-vacio { color:var(--fg-3); font-size:13px; padding:14px; text-align:center; }
    .cg-hoy { display:flex; gap:9px; align-items:center; width:100%; text-align:left; background:none; border:0;
              border-top:1px solid var(--border-subtle); padding:8px 16px; font-size:13px; color:var(--fg-2); cursor:pointer; }
    .cg-hoy:hover { background:var(--accent-soft, #E6F4FB); }
    .cg-hoy.bad span:first-child  { color:#A03030; }
    .cg-hoy.warn span:first-child { color:#8A6415; }
    .cg-hoy.info span:first-child { color:#0B5E8A; }
    .cg-overlay { position:fixed; inset:0; background:rgba(11,42,71,.45); display:grid; place-items:center;
                  padding:20px; z-index:80; }
    .cg-modal { background:var(--surface-card); border-radius:14px; box-shadow:0 20px 50px -20px rgba(11,42,71,.4);
                width:min(760px,100%); max-height:88vh; overflow:auto; padding:20px 22px; }
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

<div id="topbar-mount"></div>
<script>
  Layout.renderTopbar({ title: '<i data-lucide="compass"></i> Centro de gestión de clientes', showHome: true, homeHref: '../index.html', showLogout: true,
    menu: [{ href: '../contratos/index.html', label: '<i data-lucide="file-text"></i> Contratos' },
           { href: './index.html', label: '<i data-lucide="users"></i> Clientes' }] });
</script>

<div class="app-wrap">

  <!-- ── Vista: directorio ─────────────────────────────────────────── -->
  <div id="vistaLista">
    <div id="cgParaHoy"></div>
    <div class="cg-tools">
      <input class="form-input cg-buscar" id="cgBuscar" type="search"
             placeholder="Buscar cliente por nombre, RUC o representante…" autocomplete="off">
      <div class="seg" role="group" aria-label="Filtro de cartera">
        <button type="button" class="seg-btn" id="segMios" onclick="Centro.setCartera('mios')">Mi cartera</button>
        <button type="button" class="seg-btn" id="segTodos" onclick="Centro.setCartera('todos')">Todos</button>
      </div>
      <label class="cg-toggle" title="Ocultar clientes marcados como inactivos">
        <input type="checkbox" id="cgSoloActivos" onchange="Centro.setSoloActivos(this.checked)"> Solo activos
      </label>
      <span id="cgResumen" style="font-size:13px; color:var(--fg-3);"></span>
    </div>
    <div id="cgLista"></div>
    <div style="text-align:center; margin-top:var(--sp-3);">
      <button class="btn btn-ghost hidden" id="btnMas">Cargar más</button>
    </div>
  </div>

  <!-- ── Vista: ficha 360 ──────────────────────────────────────────── -->
  <div id="vistaFicha" class="hidden">
    <button class="btn btn-ghost" onclick="Centro.volver()" style="margin-bottom:var(--sp-3);">
      <i data-lucide="arrow-left"></i> Clientes</button>

    <div class="ds-card" style="padding:var(--sp-5);">
      <div class="cg-head">
        <div class="cg-av" id="fAvatar" style="width:48px;height:48px;font-size:17px;"></div>
        <div style="min-width:0;">
          <h2 id="fNombre" style="margin:0; font-size:20px;"></h2>
          <p id="fMeta" style="margin:4px 0 0; color:var(--fg-3); font-size:13px;"></p>
        </div>
        <div class="cg-acts">
          <button class="btn btn-primary" id="btnGestion" onclick="Centro.toggleMenu(event)">
            Nueva gestión <i data-lucide="chevron-down"></i></button>
          <div class="cg-menu hidden" id="cgMenu"></div>
        </div>
      </div>
    </div>

    <div class="cg-kpis" id="fKpis"></div>
    <div id="fSenales" style="margin-bottom:var(--sp-4);"></div>

    <div class="ds-card" style="padding:var(--sp-4); margin-bottom:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-3);"><i data-lucide="file-text" style="width:16px;height:16px;"></i> Contratos</h3>
      <div class="cg-twrap" id="fContratos"></div>
    </div>

    <div class="ds-card" style="padding:var(--sp-4); margin-bottom:var(--sp-4);">
      <div style="display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:var(--sp-3);">
        <h3 style="margin:0; flex:1;"><i data-lucide="radio" style="width:16px;height:16px;"></i> Equipos del cliente</h3>
        <input class="form-input" id="fEqFiltro" type="search" placeholder="Filtrar por serial, modelo o contrato…"
               style="max-width:300px;" autocomplete="off">
      </div>
      <div class="cg-twrap" id="fEquipos"></div>
    </div>

    <div class="ds-card" style="padding:var(--sp-4);">
      <h3 style="margin:0 0 var(--sp-3);"><i data-lucide="refresh-cw" style="width:16px;height:16px;"></i> Gestiones</h3>
      <div id="fGestiones"></div>
    </div>
  </div>

</div>

<div id="cgModal" class="cg-overlay hidden"></div>

<script defer src="../js/ui/toast.js"></script>
<script src="../js/pages/clientes-centro.js?v=cg26" defer></script>
  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    document.addEventListener('DOMContentLoaded', () => { Layout.initRail('centro'); Centro.init(); });
  </script>
</body>
