  <style>
    /* Centro de gestión (cg-*) — Ola 1 gestiones por cliente */
    .cg-tools { display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-bottom:var(--sp-4); }
    .cg-aprobaciones { border:1px solid var(--border-default); border-radius:10px; padding:14px; margin-bottom:var(--sp-4); background:var(--surface-card); }
    .cg-aprobaciones-head { display:flex; align-items:center; flex-wrap:wrap; gap:10px; }
    .cg-aprobaciones-head h2 { font-size:15px; margin:0; margin-right:auto; }
    .cg-aprobaciones-tabs { display:flex; flex-wrap:wrap; gap:8px; margin-top:10px; }
    .cg-aprobaciones-tabs .is-on { background:var(--accent-soft, #E6F4FB); border-color:var(--accent); }
    .cg-aprobaciones-tabs b { border-radius:12px; padding:1px 8px; background:var(--soft-warn, #FBF3E0); color:#8A6415; font-variant-numeric:tabular-nums; }
    .cg-aprobacion-row { display:flex; align-items:center; gap:12px; padding:10px 0; border-bottom:1px solid var(--border-subtle); font-size:13px; }
    .cg-aprobacion-row > div { flex:1; min-width:0; overflow-wrap:anywhere; }
    .cg-aprobacion-row span { display:block; font-size:12px; color:var(--fg-3); margin-top:3px; }
    .cg-aprobaciones-mensaje { font-size:13px; color:var(--fg-3); margin-top:10px; }
    .cg-aprobaciones-mensaje:empty { display:none; }
    .cg-buscar { flex:1; min-width:240px; max-width:480px; }
    .seg { display:inline-flex; border:1px solid var(--border-default); border-radius:var(--radius-pill); overflow:hidden; }
    .seg-btn { border:0; background:var(--surface-card); color:var(--fg-2); padding:5px 14px; font-size:13px; font-weight:600; cursor:pointer; }
    .seg-btn.is-on { background:var(--accent); color:#fff; }
    .seg-btn + .seg-btn { border-left:1px solid var(--border-default); }
    .cg-toggle { display:inline-flex; align-items:center; gap:6px; border:1px solid var(--border-default);
                 border-radius:var(--radius-pill); padding:5px 14px; font-size:13px; font-weight:600;
                 color:var(--fg-2); background:var(--surface-card); cursor:pointer; user-select:none; }
    .cg-toggle input { width:auto; margin:0; accent-color: var(--accent); }
    .cg-row { display:flex; gap:14px; align-items:center; background:var(--surface-card); border:1px solid var(--border-subtle);
              border-radius:var(--radius-md); padding:11px 16px; margin-bottom:8px; cursor:pointer; text-decoration:none; color:inherit; }
    .cg-row:hover { border-color:var(--accent); }
    .cg-av { width:38px; height:38px; border-radius:10px; background:var(--navy); color:#fff; display:grid; place-items:center;
             font-weight:700; font-size:14px; flex:none; }
    .cg-row .n { font-weight:600; font-size:14.5px; }
    .cg-row .s { font-size:12.5px; color:var(--fg-3); }
    .cg-row .arr { margin-left:auto; color:var(--fg-4); font-size:18px; font-weight:600; }
    .cg-kpis { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:var(--sp-4) 0; }
    @media (max-width:760px){ .cg-kpis { grid-template-columns:1fr 1fr; } }
    .cg-kpi { background:var(--surface-card); border:1px solid var(--border-subtle); border-radius:var(--radius-md); padding:12px 15px; }
    .cg-kpi .v { font-size:22px; font-weight:700; color:var(--navy); font-variant-numeric:tabular-nums; line-height:1.1; }
    .cg-kpi .l { font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); font-weight:600; margin-top:4px; }
    .cg-senal { display:flex; gap:8px; align-items:flex-start; border-radius:8px; padding:9px 13px; font-size:13px; margin-bottom:8px; }
    .cg-senal.warn { background:var(--soft-warn, #FBF3E0); color:#8A6415; }
    .cg-senal.bad  { background:var(--soft-bad, #FBE9E9); color:#A03030; }
    .cg-senal.info { background:var(--accent-soft, #E6F4FB); color:#0B5E8A; }
    .cg-vida { min-width:150px; }
    .cg-vida .lbl { font-size:12.5px; font-weight:700; display:block; line-height:1.2; }
    .cg-vida .sub { font-size:11px; color:var(--fg-4); }
    .cg-vida .bar { height:5px; border-radius:999px; background:var(--surface-sunken, #EEF2F6); overflow:hidden; margin-top:4px; max-width:160px; }
    .cg-vida .bar i { display:block; height:100%; border-radius:999px; }
    .cg-venc { font-size:12px; font-weight:600; border-radius:999px; padding:1px 9px; white-space:nowrap; }
    .cg-venc.vigente { background:#E4F5EC; color:#17714B; }
    .cg-venc.por_vencer { background:#FBF3E0; color:#8A6415; }
    .cg-venc.vencido { background:#FBE9E9; color:#A03030; }
    .cg-tabla { width:100%; border-collapse:collapse; font-size:13.5px; }
    .cg-tabla th { font-size:11px; letter-spacing:.07em; text-transform:uppercase; color:var(--fg-3); text-align:left;
                   padding:8px 12px; border-bottom:1px solid var(--border-subtle); white-space:nowrap; }
    .cg-tabla td { padding:9px 12px; border-bottom:1px solid var(--border-subtle); vertical-align:middle; }
    .cg-tabla tr:last-child td { border-bottom:none; }
    .cg-twrap { overflow-x:auto; }
    .cg-mono { font-family:var(--font-mono, ui-monospace); font-size:.93em; }
    .cg-head { display:flex; gap:14px; align-items:flex-start; flex-wrap:wrap; }
    .cg-acts { margin-left:auto; display:flex; gap:8px; flex-wrap:wrap; position:relative; }
    .cg-menu { position:absolute; right:0; top:calc(100% + 6px); background:var(--surface-card); border:1px solid var(--border-default);
               border-radius:10px; box-shadow:0 10px 30px -12px rgba(11,42,71,.25); min-width:250px; z-index:50;
               max-height:70vh; overflow:auto; }
    .cg-menu .hd { font-size:10.5px; letter-spacing:.09em; text-transform:uppercase; font-weight:700; color:var(--fg-4); padding:8px 14px 3px; }
    /* `label` va en la lista: las acciones que suben un archivo (carta, anexo,
       contrato firmado) son <label> con un input file adentro, y sin esta
       regla salían con la letra del body, sin padding y sin separador. */
    .cg-menu a, .cg-menu button, .cg-menu label { display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--border-subtle);
               padding:9px 14px; font-size:13.5px; font-family:inherit; line-height:1.35; color:var(--fg-1); text-decoration:none; cursor:pointer; }
    .cg-menu a:hover, .cg-menu button:hover, .cg-menu label:hover { background:var(--accent-soft, #E6F4FB); }
    .cg-menu .off { color:var(--fg-4); cursor:not-allowed; }
    /* Menú por intención (plan 2026-09-08 §4.2): un destacado arriba, grupos
       Dar equipos / Cambiar / Retirar, pistas de UNA línea, pie discreto. */
    .cg-menu .top { font-weight:600; background:var(--accent-soft, #E6F4FB); }
    .cg-menu .cg-menu-hint { display:block; font-size:11px; font-weight:400; color:var(--fg-4); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cg-menu .pie { font-size:12px; color:var(--fg-3); border-bottom:0; }
    .cg-menu .off:hover { background:none; }
    /* Acciones del expediente (2026-09-09): UN menú por gestión o contrato,
       siempre en el mismo sitio — el "⋯" de la fila y el pie del detalle.
       Lo que no se puede sale en gris CON el motivo, nunca escondido. */
    /* Historial atenuado: la opacidad va en el CONTENIDO, nunca en la fila
       entera. Puesta en la fila, el menú "⋯" (que cuelga de ella) heredaba el
       .62 — se veía traslúcido — y la opacidad abría un contexto de
       apilamiento que lo dejaba DEBAJO de las filas siguientes. */
    .cg-row.cg-tenue > *:not(.cg-rowacts) { opacity:.62; }
    .cg-row.cg-tenue .cg-masbtn { opacity:.62; }
    .cg-row.cg-tenue .cg-masbtn:hover { opacity:1; }
    .cg-rowacts { position:relative; flex:none; display:inline-flex; gap:8px; align-items:center; }
    .cg-masbtn { background:none; border:1px solid var(--border-subtle); border-radius:8px; width:32px; height:28px;
                 line-height:1; font-size:17px; color:var(--fg-3); cursor:pointer; padding:0; }
    .cg-masbtn:hover { background:var(--surface-sunken, #F6F9FB); color:var(--fg-1); border-color:var(--border-default); }
    /* text-align propio: la celda de la tabla de contratos alinea a la
       derecha y el menú lo heredaba (títulos y "subir…" pegados al borde). */
    .cg-accmenu { min-width:288px; max-width:340px; text-align:left; }
    .cg-accmenu label { text-align:left; }
    .cg-accmenu .cg-menu-hint { white-space:normal; line-height:1.35; margin-top:2px; }
    .cg-accmenu .mal { color:var(--bad-deep, #991B1B); }
    .cg-accmenu.cg-up { top:auto; bottom:calc(100% + 6px); }
    .cg-vacio { color:var(--fg-3); font-size:13px; padding:14px; text-align:center; }
    /* ── Ficha reordenada (2026-09-08): cola "Ahora", franja de números,
       bloques plegables, equipos por grupo, dock móvil ── */
    .cg-ahora { background:var(--surface-card); border:1px solid var(--border-default); border-radius:10px; margin:var(--sp-4) 0 10px; overflow:hidden; }
    .cg-ahora .hd { font-size:11px; letter-spacing:.09em; text-transform:uppercase; color:var(--fg-3); font-weight:700; padding:9px 14px 4px; display:flex; gap:10px; align-items:center; }
    .cg-ahora .hd .mas { margin-left:auto; background:none; border:0; color:var(--accent); font-size:12px; font-weight:600; cursor:pointer; text-transform:none; letter-spacing:0; }
    .cg-ahora .row { display:grid; grid-template-columns:10px minmax(0,1fr) auto; gap:12px; align-items:center; padding:9px 14px; border-top:1px solid var(--border-subtle); }
    .cg-ahora .row .dot { width:10px; height:10px; border-radius:50%; background:var(--accent); }
    .cg-ahora .row.bad .dot { background:#D24545; } .cg-ahora .row.warn .dot { background:#E0A93A; }
    .cg-ahora .row .t { min-width:0; font-size:13.5px; } .cg-ahora .row .t b { font-weight:600; }
    .cg-ahora .row .t .s { display:block; color:var(--fg-3); font-size:12.5px; }
    .cg-ahora .row .t .toca { color:var(--fg-2); font-weight:600; }
    .cg-ahora .row .btns { display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
    .cg-ahora .ok { padding:10px 14px; font-size:13px; color:var(--cg-ok-deep, #17714B); display:flex; gap:8px; align-items:center; }
    .cg-resumen { display:flex; flex-wrap:wrap; gap:6px 18px; font-size:12.5px; color:var(--fg-3); padding:0 4px; margin-bottom:12px; }
    .cg-resumen b { color:var(--fg-1); font-weight:600; font-variant-numeric:tabular-nums; }
    .cg-resumen button { background:none; border:0; padding:0; font:inherit; color:var(--fg-3); cursor:pointer; border-bottom:1px dotted var(--accent-line, #66BCE7); }
    .cg-resumen button:hover { color:var(--fg-1); }
    .cg-block { background:var(--surface-card); border:1px solid var(--border-default); border-radius:10px; margin-bottom:10px; }
    .cg-block > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:24px auto minmax(0,1fr) 18px; gap:10px; align-items:center; padding:11px 14px; user-select:none; }
    .cg-block > summary::-webkit-details-marker { display:none; }
    .cg-block > summary .ic { width:24px; height:24px; border-radius:6px; background:var(--surface-sunken, #EEF2F6); display:grid; place-items:center; color:var(--fg-2); }
    .cg-block > summary .ic svg, .cg-block > summary .ic i { width:14px; height:14px; }
    .cg-block > summary .ttl { font-family:var(--font-display); font-weight:700; font-size:15.5px; }
    .cg-block > summary .sum { color:var(--fg-3); font-size:12.5px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .cg-block > summary .chev { color:var(--fg-4); font-size:18px; font-weight:600; transition:transform .15s; text-align:center; }
    .cg-block[open] > summary .chev { transform:rotate(90deg); }
    .cg-block > .in { border-top:1px solid var(--border-subtle); padding:10px 14px 14px; }
    .cg-eqgrp { border:1px solid var(--border-subtle); border-radius:8px; margin-bottom:6px; }
    .cg-eqgrp > summary { list-style:none; cursor:pointer; display:grid; grid-template-columns:minmax(0,1fr) auto auto auto 18px; gap:12px; align-items:center; padding:8px 12px; font-size:13px; user-select:none; }
    .cg-eqgrp > summary::-webkit-details-marker { display:none; }
    .cg-eqgrp > summary .k { color:var(--fg-3); font-size:12.5px; white-space:nowrap; }
    .cg-eqgrp > summary .chev { color:var(--fg-4); font-weight:600; text-align:center; }
    .cg-eqgrp[open] > summary { border-bottom:1px solid var(--border-subtle); }
    .cg-eqgrp[open] > summary .chev { transform:rotate(90deg); }
    .cg-eqgrp.warn > summary { background:var(--cg-warn-soft, #FBF3E0); }
    .cg-dock { display:none; }
    @media (max-width:760px) {
      .cg-block > summary { grid-template-columns:24px minmax(0,1fr) 18px; }
      .cg-block > summary .sum { grid-column:2; white-space:normal; }
      .cg-eqgrp > summary { grid-template-columns:minmax(0,1fr) auto 18px; }
      .cg-eqgrp > summary .k:nth-of-type(2) { display:none; }
      .cg-ahora .row { grid-template-columns:10px minmax(0,1fr); }
      .cg-ahora .row .btns { grid-column:2; justify-content:flex-start; }
      /* Dock inferior con las dos acciones; el FAB del rail sube para no taparlo. */
      /* El FAB del rail vive DENTRO del dock (primera celda vacía): nada tapa el contenido. */
      .cg-dock { display:grid; grid-template-columns:54px 1fr 1fr; gap:8px; position:fixed; left:0; right:0; bottom:0; z-index:1050;
                 background:var(--surface-card); border-top:1px solid var(--border-default); padding:10px 12px calc(10px + env(safe-area-inset-bottom)); }
      .cg-dock .btn { justify-content:center; }
      .cg-dock:empty { display:none; }
      #vistaFicha { padding-bottom:84px; }
      .rail-fab { bottom:12px !important; left:12px !important; z-index:1100 !important; }
      #btnPrimario, #btnGestion { display:none; }
      /* Barra superior: en el teléfono el título montaba sobre "Menú principal"
         y "Cerrar sesión" (recorrido con emulador 2026-09-08). Aquí solo el
         título y el menú; el resto vive en el rail. */
      .topbar .topbar-title { font-size:15px; max-width:calc(100vw - 120px); overflow:hidden; text-overflow:ellipsis; }
      .topbar .topbar-actions > a.btn, .topbar .topbar-actions > button.btn:not(.btn-topbar-menu) { display:none; }
      .cg-head { flex-wrap:nowrap; }
      .cg-acts { margin-left:0; }
    }
    /* Los modales del Centro son hojas del kit (Modal.sheet → .modal-backdrop
       de ceco-ui.css, 2026-09-10). El overlay propio que vivía aquí quedó
       fuera: era CSS suelto en la página, y un resto de declaración huérfano
       lo invalidó entre el 26-ago y el 9-sep-2026 dejando los modales al pie
       de la página. El del kit está en la hoja compartida y con guardias. */
    .hidden { display:none !important; }
  </style>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">

<div id="topbar-mount"></div>
<script>
  Layout.renderTopbar({ title: '<i data-lucide="compass"></i> Centro de gestión de clientes', showHome: true, homeHref: '../index.html', showLogout: true,
    menu: [{ href: '../contratos/index.html', label: '<i data-lucide="file-text"></i> Contratos' },
           { href: './index.html', label: '<i data-lucide="users"></i> Clientes' }] });
</script>

<div class="app-wrap">

  <!-- ── Vista: directorio ─────────────────────────────────────────── -->
  <div id="vistaLista">
    <!-- El buscador va PRIMERO (pedido de Zuleika 2026-09-04): el objetivo de
         esta pantalla es encontrar al cliente. Aprobaciones consulta solo
         las dos colas pendientes; no barre el pool ni las fichas de clientes. -->
    <div class="cg-tools">
      <input class="form-input cg-buscar" id="cgBuscar" type="search"
             placeholder="Buscar cliente por nombre, RUC o representante…" autocomplete="off">
      <div class="seg" role="group" aria-label="Filtro de cartera">
        <button type="button" class="seg-btn" id="segMios" onclick="Centro.setCartera('mios')">Mi cartera</button>
        <button type="button" class="seg-btn" id="segTodos" onclick="Centro.setCartera('todos')">Todos</button>
      </div>
      <label class="cg-switch" title="Ocultar clientes marcados como inactivos">
        <input type="checkbox" id="cgSoloActivos" onchange="Centro.setSoloActivos(this.checked)">
        <span class="trk" aria-hidden="true"></span> Solo activos
      </label>
      <span id="cgResumen" style="font-size:13px; color:var(--fg-3);"></span>
      <!-- Bandeja "Cuentas por regularizar" (admin/gerencia): la pinta init(). -->
      <span id="cgToolsExtra" style="margin-left:auto;"></span>
    </div>
    <section id="cgAprobaciones" class="cg-aprobaciones hidden" aria-labelledby="cgAprobacionesTitulo">
      <div class="cg-aprobaciones-head">
        <h2 id="cgAprobacionesTitulo">Pendientes por aprobar</h2>
        <button type="button" class="btn btn-ghost" data-aprobaciones-refresh>Actualizar</button>
      </div>
      <div class="cg-aprobaciones-tabs">
        <button type="button" class="btn" data-aprobaciones="gestiones" aria-expanded="false" aria-controls="cgAprobacionesLista">Gestiones <b data-aprobaciones-count="gestiones">…</b></button>
        <button type="button" class="btn" data-aprobaciones="contratos" aria-expanded="false" aria-controls="cgAprobacionesLista">Contratos <b data-aprobaciones-count="contratos">…</b></button>
      </div>
      <div id="cgAprobacionesLista" data-aprobaciones-lista></div>
      <div class="cg-aprobaciones-mensaje" data-aprobaciones-mensaje role="status"></div>
      <button type="button" class="btn btn-ghost hidden" data-aprobaciones-mas>Cargar más pendientes</button>
    </section>
    <div id="cgLista"></div>
    <div style="text-align:center; margin-top:var(--sp-3);">
      <button class="btn btn-ghost hidden" id="btnMas">Cargar más</button>
    </div>
  </div>

  <!-- ── Vista: ficha 360 ──────────────────────────────────────────── -->
  <div id="vistaFicha" class="hidden">
    <button class="btn btn-ghost" onclick="Centro.volver()" style="margin-bottom:var(--sp-3);">
      <i data-lucide="arrow-left"></i> Clientes</button>

    <div class="ds-card" style="padding:var(--sp-5);">
      <div class="cg-head">
        <div class="cg-av" id="fAvatar" style="width:48px;height:48px;font-size:17px;"></div>
        <div style="min-width:0;">
          <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
            <h2 id="fNombre" style="margin:0; font-size:20px;"></h2>
            <!-- Deuda de regularización de la cuenta (plan 2026-09-08): lee
                 clientes.regularizacion (lo escribe el job); clic → "Qué falta". -->
            <span id="fRegChip"></span>
          </div>
          <p id="fMeta" style="margin:4px 0 0; color:var(--fg-3); font-size:13px;"></p>
        </div>
        <div class="cg-acts">
          <!-- Rediseño de la ficha (2026-09-08, "cada pieza en su lugar"):
               UN botón primario contextual (Regularizar / Renovar / Ver
               trámite / Nuevo contrato), "Nueva gestión" para todo lo demás y
               un "⋯" con Cotizar · Datos · Historial. Lo pinta _pintarPrimario. -->
          <button class="btn btn-primary hidden" id="btnPrimario"></button>
          <button class="btn" id="btnGestion" onclick="Centro.toggleMenu(event)">
            Nueva gestión <i data-lucide="chevron-down"></i></button>
          <div class="cg-menu hidden" id="cgMenu"></div>
          <button class="btn btn-ghost" id="btnMasFicha" onclick="Centro.toggleMas(event)" aria-label="Más opciones"
                  title="Cotizar · Datos del cliente · Historial"><i data-lucide="more-horizontal"></i></button>
          <div class="cg-menu hidden" id="cgMasMenu" style="min-width:220px;"></div>
        </div>
      </div>
    </div>

    <!-- Una sola cola "Ahora": lo que antes eran "Requiere tu acción" + las
         señales + la regularización, ordenadas por urgencia, con quién debe
         actuar y un botón por fila. Debajo, la franja de números (sin tiles). -->
    <div id="fAhora" class="cg-ahora"></div>
    <div id="fResumen" class="cg-resumen"></div>

    <!-- Bloques plegables con resumen en la cabecera: Gestiones primero
         (abierto si hay trabajo vivo), Contratos, Equipos agrupados, Actividad. -->
    <details class="cg-block" id="blkGestiones">
      <summary><span class="ic"><i data-lucide="refresh-cw"></i></span><span class="ttl">Gestiones</span><span class="sum" id="sumGestiones"></span><span class="chev">›</span></summary>
      <div class="in"><div id="fGestiones"></div></div>
    </details>

    <details class="cg-block" id="blkContratos">
      <summary><span class="ic"><i data-lucide="file-text"></i></span><span class="ttl">Contratos</span><span class="sum" id="sumContratos"></span><span class="chev">›</span></summary>
      <div class="in"><div class="cg-twrap" id="fContratos"></div></div>
    </details>

    <details class="cg-block" id="blkEquipos">
      <summary><span class="ic"><i data-lucide="radio"></i></span><span class="ttl">Equipos</span><span class="sum" id="sumEquipos"></span><span class="chev">›</span></summary>
      <div class="in">
        <div style="display:flex; justify-content:flex-end; margin-bottom:8px;">
          <input class="form-input" id="fEqFiltro" type="search" placeholder="Buscar serial, modelo o contrato…"
                 style="max-width:300px;" autocomplete="off" aria-label="Buscar equipo">
        </div>
        <div id="fEquipos"></div>
      </div>
    </details>

    <details class="cg-block" id="blkActividad">
      <summary><span class="ic"><i data-lucide="history"></i></span><span class="ttl">Actividad</span><span class="sum" id="sumActividad">quién cambió qué en la ficha</span><span class="chev">›</span></summary>
      <div class="in"><div id="fActividad"><div class="cg-vacio">Ábrelo para cargar el historial.</div></div></div>
    </details>

    <!-- Móvil: las dos acciones siempre al alcance del pulgar. -->
    <div class="cg-dock" id="cgDock"></div>
  </div>

</div>

<script defer src="../js/ui/toast.js"></script>
<!-- Kit de modales: TODO el diálogo del Centro (Modal.sheet en _abrirModal/
     _abrirModalA, más Modal.prompt/confirm para anular gestión y retirar el
     enlace de firma). Sin él la página no abre modales: va antes que
     clientes-centro.js y ambos son defer. -->
<script defer src="../js/ui/modal.js?v=f7"></script>
<!-- Conversor fotos→PDF del contrato firmado (ContratosFirmado._fotosAPdf); su init no encuentra #fileFirmado aquí y no hace nada más. -->
<script defer src="../js/pages/contratos-upload.js?v=firm2"></script>
<!-- Garantía de la unidad (cláusula 8): una sola definición, compartida con la propuesta de reemplazo del taller. -->
<script defer src="../js/domain/garantiaEquipo.js?v=1"></script>
<!-- Fichas de POC: el JSON de un reemplazo para recepción sale de la ficha del
     radio saliente (PocService.configDelSaliente), la misma fuente que usa el
     lote de POC. -->
<script defer src="../js/services/pocService.js?v=cc11"></script>
<script src="../js/pages/clientes-centro.js?v=cg106" defer></script>
  </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    document.addEventListener('DOMContentLoaded', () => { Layout.initRail('centro'); Centro.init(); });
  </script>
</body>
</html>
