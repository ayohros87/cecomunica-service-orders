<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Anexo de aumento - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.10.0/firebase-firestore-compat.js"></script>
  <script defer src="../js/firebase-init.js?v=ses2"></script>
  <style>
    /* Vista imprimible del anexo de aumento (Ola 4). El período PROPIO del
       tramo va explícito — es la razón por la que antes se usaba contrato
       Adición (decisión de negocio 2026-08-26). */
    body { font: 13.5px/1.6 Georgia, 'Times New Roman', serif; color: #111; margin: 0; background: #f2f2f2; }
    .hoja { background: #fff; max-width: 8.5in; margin: 18px auto; padding: 0.9in 1in; box-shadow: 0 2px 14px rgba(0,0,0,.15); min-height: 10in; }
    h1 { font: 700 19px/1.3 Arial, sans-serif; color: #0B2A47; margin: 0 0 2px; }
    h2 { font: 700 14px/1.3 Arial, sans-serif; color: #0B2A47; margin: 22px 0 8px; text-transform: uppercase; letter-spacing: .04em; }
    .cab { display: flex; justify-content: space-between; align-items: flex-start; border-bottom: 2.5px solid #0B2A47; padding-bottom: 12px; }
    .cab .num { font: 700 13px Arial, sans-serif; color: #0B2A47; text-align: right; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
    th { text-align: left; font: 700 11px Arial, sans-serif; text-transform: uppercase; letter-spacing: .05em; border-bottom: 1.5px solid #111; padding: 6px 8px; }
    td { border-bottom: 1px solid #ccc; padding: 7px 8px; }
    .periodo { border: 1.5px solid #0B2A47; padding: 12px 16px; margin: 14px 0; background: #F5F8FB; }
    .firmas { display: flex; gap: 60px; margin-top: 70px; }
    .firmas > div { flex: 1; border-top: 1.5px solid #111; padding-top: 6px; font-size: 12.5px; text-align: center; }
    .toolbar { max-width: 8.5in; margin: 14px auto 0; display: flex; gap: 10px; justify-content: flex-end; font-family: Arial, sans-serif; }
    .toolbar button { padding: 8px 18px; font: 600 13.5px Arial, sans-serif; border-radius: 8px; border: 1px solid #ccc; background: #0091D7; color: #fff; cursor: pointer; }
    #estado { text-align: center; font-family: Arial, sans-serif; color: #666; padding: 60px 0; }
    @media print { body { background: #fff; } .hoja { box-shadow: none; margin: 0; min-height: auto; } .toolbar { display: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><button onclick="window.print()">Imprimir</button></div>
  <div id="estado">Cargando anexo…</div>
  <div class="hoja" id="hoja" style="display:none;"></div>
  <script>
    'use strict';
    const esc = (v) => String(v == null ? '' : v).replace(/[&<>"']/g, c =>
      ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtFecha = (d) => d.toLocaleDateString('es-PA', { day: 'numeric', month: 'long', year: 'numeric' });

    document.addEventListener('DOMContentLoaded', () => {
      firebase.auth().onAuthStateChanged(async (user) => {
        if (!user) return (window.location.href = '../login.html');
        const gid = new URLSearchParams(location.search).get('g');
        if (!gid) { document.getElementById('estado').textContent = 'Falta el parámetro de la gestión (?g=).'; return; }
        try {
          const db = firebase.firestore();
          const gSnap = await db.collection('gestiones').doc(gid).get();
          if (!gSnap.exists) throw new Error('gestión no encontrada');
          const g = gSnap.data();
          const a = g.aumento || {};
          const [cSnap, cliSnap] = await Promise.all([
            a.contrato_doc_id ? db.collection('contratos').doc(a.contrato_doc_id).get() : Promise.resolve(null),
            g.cliente_id ? db.collection('clientes').doc(g.cliente_id).get() : Promise.resolve(null),
          ]);
          const c = cSnap?.exists ? cSnap.data() : {};
          const cli = cliSnap?.exists ? cliSnap.data() : {};
          const totalMensual = (a.lineas || []).reduce((s, l) => s + Number(l.cantidad || 0) * Number(l.precio || 0), 0);

          document.getElementById('hoja').innerHTML = `
            <div class="cab">
              <div>
                <h1>CECOMUNICA</h1>
                <div style="font:12px Arial,sans-serif;color:#555;">Comunicaciones de Panamá</div>
              </div>
              <div class="num">ANEXO DE AUMENTO<br>${esc(gid)}<br>
                <span style="font-weight:400;color:#555;">Contrato ${esc(a.contrato_id || '—')}</span></div>
            </div>

            <h2>Anexo de aumento de equipos al contrato ${esc(a.contrato_id || '—')}</h2>
            <p>Entre <b>CECOMUNICA</b> y <b>${esc(g.cliente_nombre || cli.nombre || '—')}</b>
              (RUC ${esc(cli.rucdv_norm || c.cliente_rucdv || '—')}), representada por
              <b>${esc(cli.representante || c.representante || '—')}</b>, se conviene AUMENTAR los equipos del
              contrato <b>${esc(a.contrato_id || '—')}</b> con las siguientes líneas, que quedan sujetas a los
              mismos términos y condiciones del contrato, salvo el período de vigencia que se pacta expresamente
              en este anexo:</p>

            <table>
              <thead><tr><th>Cantidad</th><th>Modelo</th><th>Precio mensual (unidad)</th><th>Subtotal/mes</th></tr></thead>
              <tbody>${(a.lineas || []).map(l => `<tr>
                <td>${Number(l.cantidad || 0)}</td>
                <td>${esc(l.modelo || '—')}</td>
                <td>$${Number(l.precio || 0).toFixed(2)}</td>
                <td>$${(Number(l.cantidad || 0) * Number(l.precio || 0)).toFixed(2)}</td></tr>`).join('')}
                <tr><td colspan="3" style="text-align:right;"><b>Total mensual del aumento</b></td>
                    <td><b>$${totalMensual.toFixed(2)}</b></td></tr>
              </tbody>
            </table>

            <div class="periodo">
              <b>PERÍODO DE VIGENCIA PROPIO DE ESTE ANEXO.</b> Los equipos de este anexo tienen un período de
              <b>${esc(String(a.duracion_meses || '—'))} meses</b>, contado <b>desde la fecha de entrega</b> de los
              equipos al cliente. Este período es <b>independiente del período original del contrato</b>: el
              vencimiento de los equipos de este anexo será posterior al del resto del contrato, y cada período
              se renueva en su propia fecha. La facturación de estas líneas inicia con la entrega.
            </div>

            <p>Las demás cláusulas del contrato ${esc(a.contrato_id || '—')} permanecen vigentes y sin
              modificación. Este anexo forma parte integral del contrato una vez firmado por el cliente.</p>

            <p style="margin-top:26px;">Panamá, ${fmtFecha(new Date())}.</p>

            <div class="firmas">
              <div><b>EL CLIENTE</b><br>${esc(cli.representante || c.representante || '')}<br>
                ${esc(g.cliente_nombre || '—')}</div>
              <div><b>CECOMUNICA</b><br>&nbsp;<br>&nbsp;</div>
            </div>`;
          document.getElementById('estado').style.display = 'none';
          document.getElementById('hoja').style.display = '';
          document.title = `Anexo ${gid} - Cecomunica`;
        } catch (e) {
          console.error(e);
          document.getElementById('estado').textContent = 'No se pudo cargar el anexo: ' + (e.message || e);
        }
      });
    });
  </script>
</body>
</html>
