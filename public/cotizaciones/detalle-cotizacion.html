<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Detalle de cotización - Cecomunica</title>
  <link rel="stylesheet" href="../css/ceco-ui.css?v=46b11f71">
  <!-- Rediseño Command Center F5: rail lateral (híbrido). PLAN_REDISENO_COMMAND_CENTER.md -->
  <link rel="stylesheet" href="../css/ceco-rail.css?v=c83fa1b2">
  <link rel="stylesheet" href="../css/cotizaciones-kit.css?v=de4f878d">

          <script src="../js/core/modulos.js?v=a7eb381e"></script>
  <script src="../js/core/layout.js?v=72ea4cc4"></script>
  <script src="../js/core/roles.js?v=36df3f84"></script>
  <script src="../js/core/formatting.js?v=bc63140d"></script>
  <script src="../js/core/auth.js?v=5bb0cc34"></script>
  <script type="module" src="/js/entry/cotizaciones-detalle-cotizacion.js"></script>
</head>
<body>
  <div class="cc-app">
  <div id="rail-mount"></div>
  <div class="cc-work">
  <div id="topbar-mount"></div>
  <script>
    Layout.renderTopbar({
      title: '<i data-lucide="receipt"></i> Cotización',
      back: { label: '<i data-lucide="arrow-left"></i> Cotizaciones', href: 'index.html' },
      showHome: false, showLogout: true,
    });
  </script>

  <div id="detalleMount" class="app-body">
    <p>Cargando…</p>
  </div>

    </div> <!-- /cc-work -->
  </div> <!-- /cc-app -->
  <script>
    // Rail Command Center (F5) — espera auth (scripts defer) y pinta el rail del rol efectivo.
    document.addEventListener('DOMContentLoaded', () => Layout.initRail('cotizaciones'));
  </script>
</body>
</html>
