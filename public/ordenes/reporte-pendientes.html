<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <title>Reporte de Órdenes Pendientes - Cecomunica</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="../css/ceco-ui.css?v=46b11f71">

  <style>
    /* Page-local — layout para impresión */
    body { background: var(--surface-page); }
    .reporte-wrap { max-width: 1100px; margin: 20px auto; padding: 0 var(--sp-5); }
    .reporte-toolbar { display: flex; gap: var(--sp-2); margin-bottom: var(--sp-4); }
    .reporte-print {
      background: var(--surface-card);
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      padding: var(--sp-5);
    }
    .reporte-print table {
      width: 100%; border-collapse: collapse; margin-top: var(--sp-3); font-size: 13px;
    }
    .reporte-print th, .reporte-print td {
      border: 1px solid var(--border-default); padding: 6px 10px; text-align: center;
    }
    .reporte-print th { background: var(--surface-sunken); font-weight: 600; }

    @media print {
      body { background: white; }
      .reporte-toolbar { display: none !important; }
      .reporte-print { box-shadow: none; padding: 0; }
    }
  </style>

  <!-- Firebase -->
  <script type="module" src="/js/entry/ordenes-reporte-pendientes.js"></script>
</head>
<body>

  <div class="reporte-wrap">

    <div class="reporte-toolbar">
      <h2 style="margin:0; font-family:var(--font-display); flex:1;"><i data-lucide="clock"></i> Reporte de Órdenes Pendientes</h2>
      <button class="btn btn-primary" onclick="window.print()"><i data-lucide="printer"></i> Imprimir</button>
      <button class="btn btn-ghost" onclick="window.close()"><i data-lucide="x"></i> Cerrar</button>
    </div>

    <div id="mensaje" style="margin-bottom:var(--sp-3); font-weight:600;"></div>

    <div class="reporte-print">
      <div id="tablaReporte"></div>
    </div>

  </div>

  <script>
    const tablaDiv = document.getElementById("tablaReporte");
    const mensajeDiv = document.getElementById("mensaje");

    // Los scripts de Firebase cargan con defer: registrar tras DOMContentLoaded.
    document.addEventListener('DOMContentLoaded', () => {
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) {
        mensajeDiv.style.color = "var(--status-critical)";
        mensajeDiv.textContent = "Debe iniciar sesión para ver este reporte.";
        return;
      }
      // Gate de rol (auditoría órdenes P2): el reporte vuelca TODA la
      // operación pendiente (clientes + vendedores). Solo roles operativos y
      // de supervisión; ante duda (doc de usuario ilegible) se niega.
      try {
        // Rol desde la caché de sesión (Sesion, firebase-init): sin viaje al
        // servidor en navegaciones tibias; en frío comparte la lectura del rail.
        const rol = String((await Sesion.rol(user.uid)) || "").trim().toLowerCase();
        const permitidos = ["administrador", "recepcion", "jefe_taller", "gerente",
                            "tecnico", "tecnico_operativo", "vista"];
        if (!permitidos.includes(rol)) {
          mensajeDiv.style.color = "var(--status-critical)";
          mensajeDiv.textContent = "Tu rol no tiene acceso a este reporte.";
          return;
        }
      } catch (e) {
        console.error("No se pudo validar el rol:", e);
        mensajeDiv.style.color = "var(--status-critical)";
        mensajeDiv.textContent = "No se pudo validar tu acceso al reporte.";
        return;
      }
      generarReporte();
    });
    });

    // Escape HTML (auditoría órdenes P2): los nombres de cliente/vendedor
    // vienen de Firestore — sin esto, un dato con marcado se inyectaba
    // directo en la tabla del reporte.
    const esc = (v) => String(v ?? "").replace(/[&<>"']/g, m => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
    }[m]));

    async function generarReporte() {
      mensajeDiv.textContent = "Cargando datos…";
      tablaDiv.innerHTML = "";

      try {
        // Sin DEVOLUCION (2026-09-02): nace "POR ASIGNAR" pero no es una orden
        // de taller pendiente — su circuito es la recuperación de equipos.
        // Pendiente = lo que el taller todavía tiene por delante (auditoría UX
        // 2026-09-28, P0 #6): por recibir, recibido esperando técnico y
        // asignado. COMPLETADO queda fuera: ya salió del taller y su cola es
        // la de entrega, que vive en la bandeja.
        const ordenes = (await OrdenesService.filterByStatuses(["POR ASIGNAR", "RECIBIDO EN MOSTRADOR", "ASIGNADO"]))
          .filter(o => (o.tipo_de_servicio || "").toUpperCase() !== "DEVOLUCION");

        // Vendedor por NOMBRE: la app guarda el UID en vendedor_asignado; el
        // importador viejo dejaba vendedor_email. Lookup best-effort.
        const uids = [...new Set(ordenes.map(o => o.vendedor_asignado).filter(Boolean))];
        const nombrePorUid = new Map();
        try {
          const db = firebase.firestore();
          for (let i = 0; i < uids.length; i += 10) {
            const snap = await db.collection("usuarios")
              .where(firebase.firestore.FieldPath.documentId(), "in", uids.slice(i, i + 10)).get();
            snap.forEach(d => { const u = d.data() || {}; nombrePorUid.set(d.id, u.nombre || u.email || d.id); });
          }
        } catch (e) { console.warn("No se pudieron leer los vendedores:", e); }

        const fmtFecha = (f) => {
          if (!f) return "-";
          let d = null;
          if (typeof f.toDate === "function") d = f.toDate();
          else if (typeof f.seconds === "number") d = new Date(f.seconds * 1000);
          else {
            // "AAAA-MM-DD" del importador: se muestra tal cual (new Date lo
            // lee como medianoche UTC y en Panamá caería el día anterior).
            const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(f));
            if (m) return `${m[3]}/${m[2]}/${m[1]}`;
            const t = new Date(f); if (!isNaN(t)) d = t; else return String(f);
          }
          return d.toLocaleDateString("es-PA", { timeZone: "America/Panama", day: "2-digit", month: "2-digit", year: "numeric" });
        };
        // Mismos nombres que la bandeja (T1): el dato no cambia, solo el texto.
        const ETQ = { "POR ASIGNAR": "Por recibir", "RECIBIDO EN MOSTRADOR": "Por asignar", "ASIGNADO": "Asignado" };

        if (!ordenes.length) {
          mensajeDiv.textContent = "No hay órdenes pendientes.";
          return;
        }

        let tabla = `
          <table>
            <thead>
            <tr>
              <th>N° Orden</th>
              <th>Cliente</th>
              <th>Tipo de servicio</th>
              <th>Estado</th>
              <th>Fecha</th>
              <th>Cant. radios</th>
              <th>Vendedor</th>
            </tr>
            </thead>
            <tbody>
        `;

        let totalRadios = 0;

        for (const data of ordenes) {
          let nombreCliente = data.cliente_nombre || data.cliente || "No disponible";
          let vendedor = data.vendedor_nombre
            || (data.vendedor_asignado && nombrePorUid.get(data.vendedor_asignado))
            || data.vendedor_email || "No asignado";

          const equipos = (data.equipos || []).filter(e => !e.eliminado);
          const cantidadRadios = equipos.length;
          totalRadios += cantidadRadios;

          tabla += `
            <tr>
              <td>${esc(data.ordenId)}</td>
              <td>${esc(nombreCliente)}</td>
              <td>${esc(data.tipo_de_servicio || "-")}</td>
              <td>${esc(ETQ[data.estado_reparacion] || data.estado_reparacion || "-")}</td>
              <td>${esc(fmtFecha(data.fecha_creacion || data.fecha_entrada))}</td>
              <td>${cantidadRadios}</td>
              <td>${esc(vendedor)}</td>
            </tr>
          `;
        }

        tabla += `
          <tr>
            <td colspan="5" style="text-align:right; font-weight:700;">TOTAL</td>
            <td style="font-weight:700;">${totalRadios}</td>
            <td></td>
          </tr>
        `;

        tabla += "</tbody></table>";
        tablaDiv.innerHTML = tabla;
        mensajeDiv.textContent = "";

      } catch (e) {
        console.error("Error generando reporte:", e);
        mensajeDiv.style.color = "var(--status-critical)";
        mensajeDiv.textContent = "Error al generar reporte.";
      }
    }
  </script>
</body>
</html>
