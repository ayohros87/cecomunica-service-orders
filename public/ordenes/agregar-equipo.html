<!DOCTYPE html>

<head>

  <!-- Una sola captura de equipos (auditoría UX 2026-09-28, 4.2 #16).
       Esta página (un fieldset por radio) y nuevo-batch.html eran dos
       pantallas para lo mismo, con reglas distintas de dedup, aterrizaje y
       autocompletado. Quedó como redirección: conserva TODOS los parámetros
       (?orden_id=…, &jalar=…) para que los enlaces viejos, marcadores y el
       historial sigan funcionando. Sin scripts de la app: no carga Firebase. -->
  <script>
    (function () {
      var qs = window.location.search || "";
      window.location.replace("nuevo-batch.html" + qs + (window.location.hash || ""));
    })();
  </script>

<body style="font-family:system-ui,sans-serif;padding:24px;color:#334155;">
  <p>Esta pantalla se movió. Abriendo <a id="lnk" href="nuevo-batch.html">la captura de equipos</a>…</p>
  <script>document.getElementById("lnk").href = "nuevo-batch.html" + (window.location.search || "");</script>
