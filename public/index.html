<!DOCTYPE html>
<html lang="es">
<head>
  <!-- Preconnect: abre TCP+TLS a los orígenes del arranque antes de que el
       parser llegue a los <script> del SDK / primeras llamadas de auth.
       gstatic SIN crossorigin (scripts clásicos no-CORS); identitytoolkit y
       firestore CON (fetch CORS); securetoken solo DNS (se usa al expirar token). -->
  <link rel="preconnect" href="https://www.gstatic.com">
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="dns-prefetch" href="https://securetoken.googleapis.com">
  <!-- Fuentes self-hosted: preload de los 2 pesos above-the-fold (crossorigin
       es obligatorio en preload de fuentes aunque sea mismo origen). -->
  <link rel="preload" href="/brand/fonts/ibm-plex-sans-400-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/brand/fonts/barlow-700-latin-v1.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="icon" type="image/svg+xml" href="/brand/cecomunica-monogram.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#0B2A47">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cecomunica - Plataforma</title>
  <!-- Rediseño Command Center (F1) — esta página usa ceco-command.css.
       Las páginas aún no migradas siguen con ceco-ui.css. -->
  <link rel="stylesheet" href="css/ceco-command.css?v=2842eeaa">
  <link rel="stylesheet" href="css/bandeja.css?v=0a2d7aa4"> <!-- kit de bandeja: panel de señales y feeds -->

  <!-- Firebase -->
          <script src="js/core/modulos.js?v=1838cd29"></script>
    <!-- Versión compartida a propósito: home-signals llama métodos nuevos de
       senalesService (S15), así que las dos mitades tienen que ir juntas. -->
  <!-- Predicados de pendiente (espejo del servidor + test de sincronía):
       DEBE ir antes de senalesService, que delega en él. -->
         <!-- kit de bandeja (fila, panel, antigüedad); antes de señales y feeds -->
    <!-- Datos y acciones de la ficha "Órdenes por crear". equiposPoolService
       es la única ruta de escritura al pool: el descarte de una venta pasa
       por ahí para que quede en el kardex de cada unidad. -->
    <script src="js/core/serial.js?v=37e4721b"></script> <!-- identidad de serial (Serial.norm), antes de los servicios -->
          <!-- Lucide en defer + icons.js (par adyacente, en este orden): icons.js hace
       el barrido inicial de <i data-lucide>; los guards inline viejos quedan
       como no-ops en parse. Ver js/core/icons.js. -->
  <script type="module" src="/js/entry/index.js"></script>
</head>
<body>
  <!-- Banner de impersonation (modo "Ver como" para admin — se rellena dinámicamente) -->
  <div id="impersonateBanner" style="display:none;background:#fef3c7;color:#78350f;border-bottom:1px solid #fde68a;padding:8px 16px;font-size:13px;text-align:center;font-weight:600;position:sticky;top:0;z-index:100;"></div>

  <!-- ============ FRANJA DE MARCA (única zona navy) ============ -->
  <div class="launch__hero">
    <div class="launch__hero-top">
      <img src="brand/cecomunica-monogram.svg" alt="Cecomunica">
      <div class="wm"><b>CECOMUNICA</b><span>Plataforma</span></div>
      <div class="launch__hi">
        <div class="who">
          <b id="saludoNombre">&nbsp;</b>
          <span id="saludoMeta">&nbsp;</span>
        </div>
        <a class="btn btn--inverse btn--icon" href="perfil.html" title="Mi perfil" aria-label="Mi perfil"><i data-lucide="user"></i></a>
        <a class="btn btn--inverse btn--icon" href="admin/index.html" id="btnAdminPanel" title="Panel admin" aria-label="Panel admin" style="display:none"><i data-lucide="shield"></i></a>
        <button class="btn btn--inverse btn--icon" onclick="cerrarSesion()" title="Cerrar sesión" aria-label="Cerrar sesión"><i data-lucide="log-out"></i></button>
      </div>
    </div>
  </div>

  <!-- ============ SEÑALES ACCIONABLES (solo lo que el rol puede ver) ============ -->
  <div class="launch__signals" id="signalsRow"></div>

  <!-- ============ DEVOLUCIONES ============ -->
  <div class="feed-ordenes" id="feedDevoluciones" style="display:none"></div>

  <!-- ============ BUSCADOR ============ -->
  <div class="launch__search">
    <div class="input-group search">
      <i data-lucide="search"></i>
      <!-- Auditoría UX 2026-09-28 (T6): el buscador del home solo filtraba
           tarjetas. Ahora filtra si el texto es un módulo y, si no, abre el
           buscador global (Ctrl+K) con lo tecleado; Enter lo abre siempre. -->
      <input id="buscador" class="cc-input" type="search" placeholder="Buscar cliente, orden, contrato, serial… (Ctrl+K)" aria-label="Buscar cliente, orden, contrato o serial" aria-describedby="buscadorHint" autocomplete="off" oninput="alTeclearBuscador()" onkeydown="if(event.key==='Enter'){event.preventDefault();abrirBusquedaGlobal();}">
    </div>
    <div class="hint-keys desktop-only" id="hintKeys" style="display:none">
      Atajos: <kbd>O</kbd> Órdenes <kbd>Q</kbd> Cotizaciones <kbd>C</kbd> Contratos <kbd>P</kbd> PoC <kbd>Ctrl</kbd><kbd>K</kbd> Buscar
    </div>
  </div>
  <div class="launch__search-hint" id="buscadorHint" aria-live="polite" hidden></div>

  <!-- ============ MÓDULOS POR ÁREA ============ -->
  <div class="launch">

    <!-- Skeletons mientras se resuelve el rol -->
    <div id="gridSkeleton" class="mgrid">
      <div class="skeleton-mcard"><div class="sk-ico"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sub"></div></div></div>
      <div class="skeleton-mcard"><div class="sk-ico"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sub"></div></div></div>
      <div class="skeleton-mcard"><div class="sk-ico"></div><div class="sk-lines"><div class="sk-line"></div><div class="sk-line sub"></div></div></div>
    </div>

    <div id="gridModulos" class="module-groups" style="display:none">

      <!-- Las tarjetas de módulo se generan de MODULOS.CATALOGO (js/core/
           modulos.js): misma etiqueta, icono y destino que el rail. Antes eran
           HTML estático, con nombres distintos a los del rail y una tarjeta
           "Clientes" que ningún rol veía (auditoría UX 2026-09-28, T2).
           modulos.js es síncrono en el <head>: esto corre en el parse, antes
           de la visibilidad por rol y de los atajos. -->
      <script>
        (function () {
          var esc = function (v) {
            return String(v == null ? '' : v).replace(/&/g, '&amp;').replace(/</g, '&lt;')
              .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
          };
          var html = ((window.MODULOS && MODULOS.CATALOGO) || []).map(function (g) {
            var cards = (g.items || []).map(function (it) {
              var href = String(it.href || '').replace(/^\//, '');
              return '<a class="mcard" data-keywords="' + esc(it.keywords || it.label) + '" data-mod="' + esc(it.id) + '" data-visible="false" href="' + esc(href) + '">'
                + '<span class="mcard__ico"><i data-lucide="' + esc(it.icon) + '"></i></span>'
                + '<span class="mcard__meta"><span class="mcard__t">' + esc(it.label) + '</span>'
                + (it.subtitulo ? '<span class="mcard__s">' + esc(it.subtitulo) + '</span>' : '')
                + '</span>'
                + (it.tecla ? '<span class="mcard__key">' + esc(it.tecla) + '</span>' : '')
                + '</a>';
            }).join('');
            return '<section class="mgroup"><h2 class="mgroup__t">' + esc(g.grupo) + '</h2><div class="mgrid">' + cards + '</div></section>';
          }).join('');
          var s = document.currentScript;
          if (s) s.insertAdjacentHTML('beforebegin', html);
        })();
      </script>

      <section class="mgroup">
        <h2 class="mgroup__t">Personal</h2>
        <div class="mgrid">
          <a class="mcard" data-keywords="firma correo email signature plantilla mail" data-mod="firma" data-visible="false" href="firma-correo.html">
            <span class="mcard__ico"><i data-lucide="mail"></i></span>
            <span class="mcard__meta">
              <span class="mcard__t">Mi Firma de Correo</span>
              <span class="mcard__s">Genera tu firma oficial y cópiala</span>
            </span>
            <span class="mcard__key">F</span>
          </a>
          <a class="mcard" data-keywords="perfil usuario cuenta sesion datos" data-mod="perfil" data-visible="false" href="perfil.html">
            <span class="mcard__ico"><i data-lucide="user"></i></span>
            <span class="mcard__meta">
              <span class="mcard__t">Mi Perfil</span>
              <span class="mcard__s">Datos personales y sesión</span>
            </span>
          </a>
          <a class="mcard" data-keywords="admin administracion panel usuarios config auditoria" data-mod="admin" data-visible="false" href="admin/index.html">
            <span class="mcard__ico"><i data-lucide="shield"></i></span>
            <span class="mcard__meta">
              <span class="mcard__t">Panel admin</span>
              <span class="mcard__s">Solo administradores</span>
            </span>
          </a>
        </div>
      </section>

    </div>
  </div>

  <script>
    // === VISIBILIDAD POR ROL (fuente única: js/core/modulos.js) ===
    // Nombres de rol: MODULOS.rolLabel (una sola tabla con el rail y el
    // perfil; antes esta página tenía su copia, auditoría UX 2026-09-28).

    // Los scripts de Firebase cargan con defer: registrar tras DOMContentLoaded.
    document.addEventListener('DOMContentLoaded', () => {
    firebase.auth().onAuthStateChanged(async (user) => {
      if (!user) { location.href = "/login.html"; return; }

      verificarAccesoYAplicarVisibilidad(async (rol) => {
        // === "Ver como" — impersonation visual para admin (solo visibilidad).
        // No afecta queries Firestore ni reglas — los datos siguen leyéndose
        // como el usuario real.
        const effectiveRol = MODULOS.rolEfectivo(rol);
        const impersonating = effectiveRol !== rol;

        if (impersonating) {
          const banner = document.getElementById('impersonateBanner');
          if (banner) {
            banner.style.display = '';
            banner.innerHTML = `
              <span style="margin-right:8px;">👁️</span>
              MODO VISUAL — viendo el home como <strong>${MODULOS.rolLabel(effectiveRol)}</strong>.
              Solo afecta qué tarjetas y señales se muestran; no cambia permisos reales ni datos.
              <a href="${location.pathname}" style="margin-left:12px;color:#78350f;text-decoration:underline;font-weight:700;">Salir del modo visual</a>
            `;
          }
        }

        // Saludo — sin bloquear: pinta ya con el caché de sesión (o el email)
        // y corrige async si el nombre llega después. Antes había un await de
        // usuarios/{uid} aquí que retrasaba revelar el grid completo.
        const h = new Date().getHours();
        const saludo = h < 12 ? 'Buenos días' : h < 19 ? 'Buenas tardes' : 'Buenas noches';
        const pintaSaludo = (n) => {
          document.getElementById('saludoNombre').textContent = `${saludo}, ${(n || '').split(' ')[0]}`;
        };
        const nombreCache = (window.Sesion && Sesion.cache(user.uid)?.nombre)
          || sessionStorage.getItem('ccUserName:' + user.uid) || '';
        pintaSaludo(nombreCache || user.displayName || (user.email || '').split('@')[0]);
        if (!nombreCache && window.Sesion) Sesion.nombre(user).then(pintaSaludo).catch(() => {});
        const fecha = new Date().toLocaleDateString('es-PA', { weekday: 'long', day: 'numeric', month: 'short', year: 'numeric' });
        document.getElementById('saludoMeta').textContent = `${MODULOS.rolLabel(effectiveRol)} · ${fecha}`;

        // Visibilidad de tarjetas. 'perfil' visible para todos; 'admin' solo
        // si el rol EFECTIVO es admin (en "Ver como" se oculta para simular).
        const visibles = new Set(MODULOS.deRol(effectiveRol));
        visibles.add('perfil');
        if (effectiveRol === 'administrador') visibles.add('admin');
        document.querySelectorAll("#gridModulos .mcard").forEach(card => {
          const mod = card.getAttribute("data-mod");
          card.setAttribute("data-visible", visibles.has(mod) ? "true" : "false");
        });
        if (effectiveRol === 'administrador') {
          document.getElementById('btnAdminPanel').style.display = '';
        }
        // Cuenta sin rol: antes el home quedaba con solo "Mi Perfil" y ningún
        // mensaje (auditoría UX 2026-09-28, T5).
        if (!effectiveRol) {
          document.getElementById('gridModulos').insertAdjacentHTML('beforebegin', `
            <div class="alert-banner alert-warning" role="status" style="margin:0 0 16px;">
              <div class="alert-banner-body">
                <strong>Tu cuenta todavía no tiene un rol asignado.</strong>
                Pídeselo a administración para ver los módulos que te corresponden.
              </div>
            </div>`);
        }

        // Revelar el grid YA — con rol cacheado (Sesion) esto pinta sin haber
        // tocado Firestore. Señales y feeds llegan después, cada uno con su
        // propio skeleton; no tienen por qué retener los módulos.
        document.getElementById('gridSkeleton').style.display = 'none';
        document.getElementById('gridModulos').style.display = '';
        document.getElementById('hintKeys').style.display = '';
        filtrarModulos();
        if (window.Icons) Icons.pintar(document.getElementById('gridModulos'));

        // Señales accionables — mismas fuentes de gating (módulos + rules).
        HomeSignals.render({ rolEfectivo: effectiveRol, uid: user.uid, user });

        if (window.HomeFeedDevoluciones) HomeFeedDevoluciones.render({ rolEfectivo: effectiveRol, uid: user.uid });
      });
    });
    });

    function cerrarSesion() {
      firebase.auth().signOut().then(() => {
        window.location.href = "/login.html"; // absoluto: funciona desde cualquier carpeta
      });
    }

    // === BUSCADOR: módulos + búsqueda global (auditoría UX 2026-09-28, T6) ===
    // Si lo tecleado coincide con un módulo, filtra las tarjetas como antes.
    // Si no coincide con ninguno, es un cliente/orden/serial: se abre el
    // buscador global (Ctrl+K) con ese texto. Enter lo abre siempre.
    let _timerBuscador = null;
    function alTeclearBuscador() {
      const hay = filtrarModulos();
      const q = (document.getElementById("buscador").value || "").trim();
      const hint = document.getElementById("buscadorHint");
      clearTimeout(_timerBuscador);
      if (hint) {
        hint.hidden = q.length < 2;
        hint.textContent = q.length < 2 ? "" : (hay
          ? `Enter: buscar «${q}» en clientes, órdenes, contratos y seriales.`
          : `Ningún módulo se llama así. Buscando «${q}» en todo el sistema…`);
      }
      if (!hay && q.length >= 3) _timerBuscador = setTimeout(abrirBusquedaGlobal, 450);
    }
    function abrirBusquedaGlobal() {
      clearTimeout(_timerBuscador);
      const input = document.getElementById("buscador");
      const q = (input.value || "").trim();
      if (!window.Layout || !Layout.abrirBusqueda) return;
      Layout.abrirBusqueda(q);
      // El texto pasa al palette: el buscador del home vuelve a mostrar todo.
      input.value = "";
      filtrarModulos();
      const hint = document.getElementById("buscadorHint");
      if (hint) { hint.hidden = true; hint.textContent = ""; }
    }

    // Devuelve true si quedó al menos una tarjeta visible.
    function filtrarModulos() {
      const q = (document.getElementById("buscador").value || "").toLowerCase().trim();
      document.querySelectorAll("#gridModulos .mcard").forEach(card => {
        // Respeta visibilidad por rol
        if (card.getAttribute("data-visible") !== "true") { card.style.display = "none"; return; }
        if (!q) { card.style.display = ""; return; }
        const keys = (card.getAttribute("data-keywords") || "").toLowerCase();
        const titulo = (card.querySelector(".mcard__t")?.textContent || "").toLowerCase();
        card.style.display = (keys.includes(q) || titulo.includes(q)) ? "" : "none";
      });
      // Oculta grupos que quedaron sin tarjetas visibles
      document.querySelectorAll("#gridModulos .mgroup").forEach(group => {
        const hayVisible = Array.from(group.querySelectorAll(".mcard"))
          .some(c => c.getAttribute("data-visible") === "true" && c.style.display !== "none");
        group.setAttribute("data-empty", hayVisible ? "false" : "true");
      });
      return Array.from(document.querySelectorAll("#gridModulos .mcard"))
        .some(c => c.getAttribute("data-visible") === "true" && c.style.display !== "none");
    }
  </script>
  <script>
    // === ATAJOS DE TECLADO ===
    document.addEventListener("keydown", (e) => {
      if (["INPUT", "TEXTAREA"].includes((e.target.tagName || ""))) return;
      // Solo teclas sueltas: con Ctrl/Cmd/Alt son atajos del navegador
      // (Ctrl+F buscar, Ctrl+C copiar, Ctrl+P imprimir) y no deben navegar.
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const go = (sel) => {
        const el = document.querySelector(`.mcard[data-mod='${sel}'][data-visible='true']`);
        if (el) el.click();
      };
      // Teclas desde MODULOS.CATALOGO (`tecla`, la misma que pinta la tarjeta)
      // + la de "Mi firma", que no es un módulo del catálogo.
      const TECLAS = { f: "firma" };
      ((window.MODULOS && MODULOS.CATALOGO) || []).forEach(g => (g.items || []).forEach(it => {
        if (it.tecla) TECLAS[String(it.tecla).toLowerCase()] = it.id;
      }));
      // Solo minúscula, como antes: Shift+letra no navega.
      if (e.key && Object.prototype.hasOwnProperty.call(TECLAS, e.key)) go(TECLAS[e.key]);
    });
    if (typeof lucide !== 'undefined') lucide.createIcons();
  </script>
</body>
</html>
